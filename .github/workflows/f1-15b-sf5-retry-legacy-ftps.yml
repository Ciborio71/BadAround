name: SF5 — Staging Legacy FTPS Retry (5 files)
on:
  push:
    branches:
      - deploy/f1-15b-sf5-retry-legacy-ftps
permissions:
  contents: read
concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin exact authorized application source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'b3c8e80122fecf138fa633391a4a004451972386'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/f1-15b-sf5-retry-legacy-ftps.yml'
          git diff --check HEAD^ HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Verify targeted sources
        run: |
          set -euo pipefail
          php -l wordpress/themes/badaround-child/inc/native-report.php
          php -l wordpress/themes/badaround-child/template-parts/native-report/step.php
          node --check wordpress/themes/badaround-child/assets/js/native-report/smart-address.js
          node --check wordpress/themes/badaround-child/assets/js/native-report/wizard.js
          npm ci --prefix tests
          node --test tests/f1-15b-r5-smart-address.cjs tests/native-report-f16-dom.cjs
      - name: Prepare exactly five approved files and exact read-verified rollback
        run: |
          set -euo pipefail
          for path in template-parts/native-report/step.php inc/native-report.php assets/js/native-report/smart-address.js assets/js/native-report/wizard.js assets/css/native-report.css; do
            mkdir -p "sf5-new/$(dirname "$path")" "sf5-rollback/$(dirname "$path")"
            cp "wordpress/themes/badaround-child/$path" "sf5-new/$path"
            git show "229b323d2e7f3983cfcf6661d249888ca699cb7b:wordpress/themes/badaround-child/$path" > "sf5-rollback/$path"
          done
          test "$(find sf5-new -type f | wc -l)" -eq 5
          test "$(find sf5-rollback -type f | wc -l)" -eq 5
      - uses: actions/upload-artifact@v4
        with:
          name: sf5-retry-rollback-files
          path: sf5-rollback/
          retention-days: 14
      - name: Existing FTP-Deploy-Action upload — attempt 1
        id: first
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./sf5-new/
          server-dir: /staging.badaround.it/wp-content/themes/badaround-child/
          dangerous-clean-slate: false
          state-name: .sf5-retry-legacy-state.json
          log-level: minimal
      - name: Existing FTP-Deploy-Action upload — attempt 2 if needed
        if: steps.first.outcome == 'failure'
        id: second
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./sf5-new/
          server-dir: /staging.badaround.it/wp-content/themes/badaround-child/
          dangerous-clean-slate: false
          state-name: .sf5-retry-legacy-state.json
          log-level: minimal
      - name: Existing FTP-Deploy-Action upload — attempt 3 if needed
        if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
        id: third
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./sf5-new/
          server-dir: /staging.badaround.it/wp-content/themes/badaround-child/
          dangerous-clean-slate: false
          state-name: .sf5-retry-legacy-state.json
          log-level: minimal
      - name: Restore verified baseline if every upload attempt failed
        if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure' && steps.third.outcome == 'failure'
        id: restore
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./sf5-rollback/
          server-dir: /staging.badaround.it/wp-content/themes/badaround-child/
          dangerous-clean-slate: false
          state-name: .sf5-retry-legacy-rollback.json
          log-level: minimal
      - name: Final upload result (live verification remains external)
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.first.outcome }}" = success ] || [ "${{ steps.second.outcome }}" = success ] || [ "${{ steps.third.outcome }}" = success ]; then
            echo "FTP_UPLOAD_PASS; independently compare WordPress active theme files before certifying."
          else
            echo "::error::FTP_UPLOAD_FAILED, baseline restore attempted; inspect read-only live WordPress files."
            exit 1
          fi
