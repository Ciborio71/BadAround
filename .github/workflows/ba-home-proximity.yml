name: BadAround Home proximity guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - wordpress/themes/badaround-child/inc/home-proximity.php
      - wordpress/themes/badaround-child/assets/js/home-proximity.js
      - tools/ba_home_proximity_release.py
      - .github/workflows/ba-home-proximity.yml
permissions:
  contents: read
concurrency:
  group: ba-home-proximity-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[home-proximity-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: d2328c0d3e8dc4ff17ddc1a4da26dac24f15385e
          path: prior-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify proximity selection and permission flow
        run: |
          npm ci --prefix tests --ignore-scripts
          php tests/home-proximity.php
          node --test tests/home-proximity.cjs
          node --check wordpress/themes/badaround-child/assets/js/map.js
          php -l wordpress/themes/badaround-child/inc/home-proximity.php
          php -l wordpress/themes/badaround-child/functions.php
          php -l wordpress/themes/badaround-child/front-page.php
          php -l wordpress/plugins/badaround-core/includes/class-badaround-discovery-query.php
          python3 -m py_compile tools/ba_home_proximity_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install scoped Home files with verified backup
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_home_proximity_release.py
