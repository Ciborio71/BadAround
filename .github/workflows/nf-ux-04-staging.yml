name: NF-UX-04 pinned five-file staging cutover and real v2 QA
on:
  push:
    branches: [deploy/nf-ux-04-native-v2-staging]
permissions:
  contents: read
  actions: read
concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: synthetic-nf02b
          MARIADB_DATABASE: nf02b
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      BA_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=nf02b
      BA_TEST_DB_USER: root
      BA_TEST_DB_PASSWORD: synthetic-nf02b
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
      BA_PLAYWRIGHT_MODULE: /tmp/nf03-live/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, gd, mbstring, posix, fileinfo
      - name: Verify pinned candidate, dedicated CI and scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tls evidence
          git diff --exit-code d0ac50bf4866b326943f3f4487b49fbe3d878d7b HEAD -- wordpress
          php -l wordpress/plugins/badaround-core/badaround-core.php
          php -l ops/nf04-probe.php
          node --check ops/nf04-live.cjs
          python - <<'CHECK'
          import os,json,urllib.request,subprocess
          req=urllib.request.Request('https://api.github.com/repos/Ciborio71/BadAround/actions/runs/39756049141',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req) as r:j=json.load(r)
          assert j['head_sha']=='d0ac50bf4866b326943f3f4487b49fbe3d878d7b' and j['conclusion']=='success'
          actual=subprocess.check_output(['git','diff','--name-only','ba8586b2dbc0315fc251b0ec5fcc96c7a2426124','d0ac50bf4866b326943f3f4487b49fbe3d878d7b','--','wordpress']).decode().splitlines()
          expected=['wordpress/themes/badaround-child/'+p for p in ['inc/native-report.php','assets/js/native-report/model.js','assets/js/native-report/wizard.js','assets/js/native-report/errors.js','assets/css/native-report.css']]
          assert sorted(actual)==sorted(expected)
          for run in [39748089611,39749779119]:
            req=urllib.request.Request('https://api.github.com/repos/Ciborio71/BadAround/actions/runs/'+str(run),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
            with urllib.request.urlopen(req) as r:assert json.load(r)['conclusion']=='success'
          CHECK
      - name: Prepare official browser test dependencies before any upload
        run: |
          npm install --prefix /tmp/nf03-live --no-save playwright@1.62.1
          node /tmp/nf03-live/node_modules/playwright/cli.js install --with-deps chromium
      - name: Provision officially signed chain and verify against runner root trust
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASS"
          ca=/etc/ssl/certs/ca-certificates.crt
          test -s "$ca"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          test "$(openssl x509 -in tls/yr2.pem -noout -subject)" = "subject=C = US, O = Let's Encrypt, CN = YR2"
          test "$(openssl x509 -in tls/yr-by-x1.pem -noout -subject)" = "subject=C = US, O = ISRG, CN = Root YR"
          openssl verify -CAfile "$ca" -untrusted tls/yr-by-x1.pem tls/yr2.pem
          cat tls/yr2.pem tls/yr-by-x1.pem > tls/untrusted.pem
          cat "$ca" tls/untrusted.pem > tls/curl-chain.pem
          timeout 30s openssl s_client -starttls ftp -connect "${FTP_HOST}:21" -servername "$FTP_TLS_NAME" -verify_hostname "$FTP_TLS_NAME" -verify_return_error -CAfile tls/curl-chain.pem < /dev/null > tls/handshake.log 2>&1
          grep -q 'Verify return code: 0 (ok)' tls/handshake.log
          echo 'FTPS server identity and chain VERIFIED; strict TLS remains enabled.'
      - name: Capture byte-exact rollback, theme custody and protected state
        run: python ops/nf04-deploy.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: nf04-byte-exact-rollback
          path: evidence/
          retention-days: 90
          if-no-files-found: error
      - name: Deploy only five theme files; certify runtime then one real v2 submission
        shell: bash
        run: |
          set -euo pipefail
          trap 'python ops/nf04-deploy.py rollback' ERR
          python ops/nf04-deploy.py deploy
          node ops/nf04-live.cjs qa
          python ops/nf04-deploy.py differential
          php tests/nf-ux-02c-immutability.php | tee evidence/c1-postdeploy.log
          php tests/nf-ux-02c1-persistence.php | tee evidence/c1-snapshot-postdeploy.log
          php tests/nf-ux-02c2-recovery.php | tee evidence/c2-postdeploy.log
          node ops/nf04-live.cjs golden
          python ops/nf04-deploy.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf04-staging-certification
          path: evidence/
          retention-days: 90
          if-no-files-found: error
