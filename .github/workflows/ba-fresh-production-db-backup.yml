name: BadAround fresh private production DB backup
on:
  push:
    branches:
      - reconcile/identity-production-baseline-20261104
    paths:
      - .github/workflows/ba-fresh-production-db-backup.yml
permissions:
  contents: read
concurrency:
  group: badaround-private-production-backup
  cancel-in-progress: false
jobs:
  backup-db:
    if: "github.event.head_commit.message == 'ops: retry guarded production DB backup with trusted CA chain'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MariaDB client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
      - name: Prepare verified FTPS certificate chain
        run: |
          set -euo pipefail
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/root.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/root.pem > tls/chain.pem
      - name: Compile backup controller
        run: python3 -m py_compile tools/ba_fresh_db_backup.py
      - name: Dump and securely upload production DB outside public root
        env:
          FTP_HOST: '46.231.24.137'
          FTP_TLS_NAME: 'hostmld17.aziendeitalia.com'
          FTP_TLS_CA_FILE: 'tls/chain.pem'
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
        run: python3 tools/ba_fresh_db_backup.py
      - name: Publish metadata only — never SQL, config or database credentials
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ba-fresh-production-db-backup-metadata
          path: ba-fresh-db-backup-evidence.json
          retention-days: 7
          if-no-files-found: ignore

# Execute once for fresh private database safety checkpoint.
