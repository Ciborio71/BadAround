name: GEO-PRIV-02D.1 — Publication Status Isolated QA
on:
  push:
    branches: [qa/geo-priv-02d1-status]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Restrict application diff to Publication Service
        run: |
          set -euo pipefail
          test "$(git diff --name-only a7bdbc04b7edd69ae17364bbd45d01190b495b7f 4e89ab3e5a865d978538fa035a8de879935c89ec)" = 'wordpress/plugins/badaround-core/includes/class-badaround-publication-service.php'
          test "$(git diff --name-only 4e89ab3e5a865d978538fa035a8de879935c89ec HEAD -- wordpress | wc -l)" -eq 0
          php -l wordpress/plugins/badaround-core/includes/class-badaround-publication-service.php
      - name: Existing F1.14R test suite
        run: php tests/f1-14r-publication-contract.php
      - name: Existing F1.14R consumer suite
        run: php tests/f1-14r-consumers.php
      - name: Build synthetic WordPress lifecycle test
        run: python3 tests/geo-priv-02d1-build.py
      - name: Publication status security A-I
        run: |
          php -l /tmp/geo-priv-02d1-regression.php
          php /tmp/geo-priv-02d1-regression.php
