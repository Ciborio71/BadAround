name: RADAR 02D isolated integration
on:
  push:
    branches:
      - test/radar-02d-integrated-pipeline
  pull_request:
    branches:
      - feature/radar-02c-canonical-adapter
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: |
          php -l tests/radar-02d-integrated-pipeline.php
          php tests/radar-02d-integrated-pipeline.php
