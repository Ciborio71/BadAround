name: Radar public 05 period counts
on:
  push:
    branches:
      - feature/radar-public-05-window-counts
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: |
          php -l wordpress/plugins/badaround-core/includes/class-badaround-radar-window-counts.php
          php tests/radar-public-05-window-counts.php
