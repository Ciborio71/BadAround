name: Radar preview runtime dependencies
on:
  push:
    branches:
      - fix/radar-public-04-runtime-dependencies
  pull_request:
    branches:
      - feature/radar-public-03-template-preview
permissions:
  contents: read
jobs:
  runtime-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: |
          php -l wordpress/themes/badaround-child/page-radar-demo.php
          php tests/radar-public-04-dependencies.php
          php tests/radar-public-03-template-preview.php
          php tests/radar-public-02-renderer.php
          php tests/radar-public-01-counts.php
