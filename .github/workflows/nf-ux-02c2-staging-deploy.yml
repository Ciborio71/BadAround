name: NF-UX-02C.2 pinned one-file staging deploy and event recovery QA
on:
  push:
    branches: [deploy/nf-ux-02c2-staging]
permissions:
  contents: read
  actions: read
concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify approved candidate, CI and one runtime file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tls
          test "$GITHUB_REF" = refs/heads/deploy/nf-ux-02c2-staging
          git diff --exit-code 0d1db0d7fab7f2facbe6b07ccff002b9e884cade HEAD -- wordpress
          python - <<'CHECK'
          import os,json,urllib.request,subprocess
          r=urllib.request.Request('https://api.github.com/repos/Ciborio71/BadAround/actions/runs/39647951165',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(r) as f:j=json.load(f)
          assert j['head_sha']=='0d1db0d7fab7f2facbe6b07ccff002b9e884cade' and j['conclusion']=='success'
          assert j['path']=='.github/workflows/nf-ux-02c2-recovery.yml'
          assert subprocess.check_output(['git','diff','--name-only','38c82e3472fc4adb0ab80f8fd1281373aa1ab1e0','0d1db0d7fab7f2facbe6b07ccff002b9e884cade','--','wordpress']).decode().splitlines()==['wordpress/plugins/badaround-core/includes/class-badaround-report-persistence-service.php']
          CHECK
      - name: Provision officially signed chain and verify against runner root trust
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASS"
          ca=/etc/ssl/certs/ca-certificates.crt
          test -s "$ca"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          test "$(openssl x509 -in tls/yr2.pem -noout -subject)" = "subject=C = US, O = Let's Encrypt, CN = YR2"
          test "$(openssl x509 -in tls/yr-by-x1.pem -noout -subject)" = "subject=C = US, O = ISRG, CN = Root YR"
          openssl verify -CAfile "$ca" -untrusted tls/yr-by-x1.pem tls/yr2.pem
          cat tls/yr2.pem tls/yr-by-x1.pem > tls/untrusted.pem
          cat "$ca" tls/untrusted.pem > tls/curl-chain.pem
          timeout 30s openssl s_client -starttls ftp -connect "${FTP_HOST}:21" -servername "$FTP_TLS_NAME" -verify_hostname "$FTP_TLS_NAME" -verify_return_error -CAfile tls/curl-chain.pem < /dev/null > tls/handshake.log 2>&1
          grep -q 'Verify return code: 0 (ok)' tls/handshake.log
          echo 'FTPS server identity and chain VERIFIED; strict TLS remains enabled.'
      - name: Syntax-check temporary QA harness
        run: php -l ops/nf02c2-staging-qa.php
      - name: Capture remote rollback before upload
        run: python ops/nf02c2-staging-deploy.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: nf02c2-byte-exact-rollback
          path: evidence/
          retention-days: 90
          if-no-files-found: error
      - name: Upload one runtime file, verify hashes and run controlled gate
        run: python ops/nf02c2-staging-deploy.py deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf02c2-staging-certification
          path: evidence/
          retention-days: 90
          if-no-files-found: error
