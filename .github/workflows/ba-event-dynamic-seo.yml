name: BadAround dynamic event SEO copy guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - tools/ba_event_dynamic_seo_release.py
      - .github/workflows/ba-event-dynamic-seo.yml
permissions:
  contents: read
concurrency:
  group: ba-event-dynamic-seo-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[event-dynamic-seo-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 09d8ba740486c05f18c0dcd1e2764db69fb44a73
          path: prior-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify all event subtypes, public-only copy, frozen URLs and regressions
        run: |
          npm ci --prefix tests --ignore-scripts
          find wordpress/plugins/badaround-core/includes -name "*.php" -exec php -l {} \; > /dev/null
          php -l wordpress/themes/badaround-child/template-parts/single-event-layout.php
          php -l wordpress/themes/badaround-child/template-parts/native-report/step.php
          php tests/event-dynamic-seo.php
          php tests/event-publication-policy.php
          php tests/event-structured-data.php
          php tests/event-heading.php
          php tests/test-ba-event-dates.php
          php tests/nf-ux-02b-v2.php
          php tests/test-ba-event-seo.php
          php tests/event-section-headings.php
          php tests/event-gallery.php
          node --check wordpress/plugins/badaround-core/identity-dormant/identity-access.js
          php -l wordpress/plugins/badaround-core/identity-dormant/wordpress-identity-portal.php
          php tests/test-ba-access-portal.php
          node --check wordpress/themes/badaround-child/assets/js/native-report/wizard.js
          php -l wordpress/themes/badaround-child/inc/native-report.php
          node --check wordpress/themes/badaround-child/assets/js/native-report/model.js
          php -l wordpress/themes/badaround-child/inc/event-gallery.php
          php -l wordpress/themes/badaround-child/functions.php
          php -l wordpress/themes/badaround-child/header.php
          php -l wordpress/themes/badaround-child/footer.php
          php tests/geo-prec-01-publication.php
          php tests/geo-area-01-publication.php
          node --test tests/f1-15b-r5-smart-address.cjs tests/native-report-f16-dom.cjs tests/native-report-f19-ux.cjs tests/geo-public-03-choice.cjs tests/geo-area-01-model.cjs tests/test-ba-access-ui.cjs tests/test-ba-access-wizard-dom.cjs tests/event-detail-lazy-map.cjs tests/contribution-ux.cjs
          python3 -m py_compile tools/ba_event_dynamic_seo_release.py
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install dynamic event SEO copy UX
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_event_dynamic_seo_release.py
