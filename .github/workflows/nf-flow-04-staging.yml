name: NF-FLOW-04 six steps and explicit choices — staging only
on:
  push:
    branches: [deploy/nf-flow-04]
permissions:
  contents: read
concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Verify reviewed application and isolated presentation scope
        run: |
          set -euo pipefail
          git diff --quiet 239001bab300238fb8203147e266f55ac1817e01 HEAD -- wordpress tests
          test "$(git diff --name-only 239001bab300238fb8203147e266f55ac1817e01 HEAD)" = '.github/workflows/nf-flow-04-staging.yml'
          git diff --quiet 179cb3a772e8c3b4c2a4df9f084df9812cdd8f24 HEAD -- wordpress/plugins tests/fixtures wordpress/themes/badaround-child/assets/js/native-report/model.js wordpress/themes/badaround-child/assets/js/native-report/api.js wordpress/themes/badaround-child/assets/js/native-report/smart-address.js wordpress/themes/badaround-child/assets/js/native-report/location-map.js
          git diff --name-only 179cb3a772e8c3b4c2a4df9f084df9812cdd8f24 HEAD -- wordpress > /tmp/flow-runtime-files
          test "$(wc -l < /tmp/flow-runtime-files)" -eq 6
          while IFS= read -r path; do
            case "$path" in
              wordpress/themes/badaround-child/assets/css/native-report.css|wordpress/themes/badaround-child/assets/js/native-report/errors.js|wordpress/themes/badaround-child/assets/js/native-report/wizard.js|wordpress/themes/badaround-child/inc/native-report.php|wordpress/themes/badaround-child/template-parts/native-report/shell.php|wordpress/themes/badaround-child/template-parts/native-report/step.php) ;;
              *) exit 1 ;;
            esac
          done < /tmp/flow-runtime-files
          git diff --check 179cb3a772e8c3b4c2a4df9f084df9812cdd8f24 HEAD
          node --check wordpress/themes/badaround-child/assets/js/native-report/wizard.js
          node --check wordpress/themes/badaround-child/assets/js/native-report/errors.js
          find wordpress/plugins/badaround-core wordpress/themes/badaround-child -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Native and Smart Address regression
        run: |
          set -euo pipefail
          npm ci --prefix tests
          node --test --test-concurrency=2 tests/native-report-f16.cjs tests/native-report-f16-dom.cjs tests/native-report-f19-ux.cjs tests/nf-final-01-ux.cjs tests/nf-visual-02-cards.cjs tests/nf-ux-03-compact.cjs tests/nf-ux-07-submit-feedback.cjs tests/f1-ux-beta-01.cjs tests/f1-15b-r5-smart-address.cjs tests/sf8-national-territory.cjs tests/sf9-public-privacy-boundary.cjs tests/native-media-f17d-dom.cjs tests/native-media-f17d-extra.cjs
          for file in tests/native-report-f16.php tests/native-report-f13.php tests/native-report-f14.php tests/native-report-f15.php tests/f1-15a3-territory.php tests/f1-14r-publication-contract.php tests/f1-14r-consumers.php tests/map-02r-priv-01.php; do php "$file" >/dev/null; done
      - name: Browser regression for six steps and related-field layout on Chromium and WebKit
        run: |
          set -euo pipefail
          npm install --prefix /tmp/nf-browser-runner --no-save playwright@1.62.1
          node /tmp/nf-browser-runner/node_modules/playwright/cli.js install --with-deps chromium webkit
          export BA_PLAYWRIGHT_MODULE=/tmp/nf-browser-runner/node_modules/playwright
          node tests/nf-final-01-browser.cjs
          node tests/nf-ux-06-location-browser.cjs
          node tests/nf-ux-09-icon-style-browser.cjs
          node tests/f1-ux-beta-01-browser.cjs
          BA_BROWSER_ENGINE=webkit node tests/f1-ux-beta-01-browser.cjs
  deploy:
    needs: native
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare six presentation files and verified baseline rollback
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/deploy/nf-flow-04'
          git diff --quiet 239001bab300238fb8203147e266f55ac1817e01 HEAD -- wordpress tests
          for path in assets/css/native-report.css assets/js/native-report/wizard.js assets/js/native-report/errors.js inc/native-report.php template-parts/native-report/shell.php template-parts/native-report/step.php; do
            mkdir -p "nf-new/$(dirname "$path")" "nf-rollback/$(dirname "$path")"
            cp "wordpress/themes/badaround-child/$path" "nf-new/$path"
            git show "179cb3a772e8c3b4c2a4df9f084df9812cdd8f24:wordpress/themes/badaround-child/$path" > "nf-rollback/$path"
          done
          test "$(find nf-new -type f | wc -l)" -eq 6
      - uses: actions/upload-artifact@v4
        with:
          name: nf-flow-04-baseline-rollback
          path: nf-rollback/
          retention-days: 14
          if-no-files-found: error
      - name: Upload six presentation files to staging
        id: upload
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./nf-new/
          server-dir: /staging.badaround.it/wp-content/themes/badaround-child/
          dangerous-clean-slate: false
          state-name: .nf-flow-04-state.json
          log-level: minimal
      - name: Retry transient upload failure
        if: steps.upload.outcome == 'failure'
        id: retry
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./nf-new/
          server-dir: /staging.badaround.it/wp-content/themes/badaround-child/
          dangerous-clean-slate: false
          state-name: .nf-flow-04-state.json
          log-level: minimal
      - name: Restore baseline if both uploads fail
        if: steps.upload.outcome == 'failure' && steps.retry.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./nf-rollback/
          server-dir: /staging.badaround.it/wp-content/themes/badaround-child/
          dangerous-clean-slate: false
          state-name: .nf-flow-04-rollback-state.json
          log-level: minimal
      - name: Confirm upload outcome
        run: |
          test '${{ steps.upload.outcome }}' = success || test '${{ steps.retry.outcome }}' = success
