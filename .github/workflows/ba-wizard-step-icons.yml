name: BadAround contextual wizard step icons guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - tools/ba_wizard_step_icons_release.py
      - .github/workflows/ba-wizard-step-icons.yml
permissions:
  contents: read
concurrency:
  group: ba-wizard-step-icons-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[wizard-step-icons-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 828046a9dd8b9a7c0e27bf22086d659c0576e499
          path: prior-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify wizard rendering and stored social preference regressions
        run: |
          npm ci --prefix tests --ignore-scripts
          php -l wordpress/themes/badaround-child/page-segnala-evento.php
          node --check wordpress/themes/badaround-child/assets/js/native-report/wizard.js
          php tests/native-report-f16.php
          php tests/native-social-preference.php
          node --test tests/native-social-preference.cjs tests/native-report-f16-dom.cjs tests/native-report-f19-ux.cjs
          python3 -m py_compile tools/ba_wizard_step_icons_release.py
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install contextual step icons
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_wizard_step_icons_release.py
