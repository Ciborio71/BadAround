name: Deploy RC1 to staging
# RC1 D3 one-shot-template-sync

on:
  push:
    branches:
      - release/mvp-rc1
    paths:
      - .github/workflows/deploy-rc1-staging.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: badaround-staging-rc1
  cancel-in-progress: false

jobs:
  validate:
    name: Validate RC1 PHP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Lint BadAround core plugin
        run: find ./wordpress/plugins/badaround-core -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Lint BadAround child theme
        run: find ./wordpress/themes/badaround-child -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test D1 Sentinel lifecycle
        run: php ./tests/sentinels-d1.php
      - name: Test D2 Sentinel matching
        run: php ./tests/sentinels-d2.php

      - name: Test D3 Sentinel completion
        run: php ./tests/sentinels-d3.php

  deploy:
    name: Deploy RC1 core and theme
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Upload core plugin over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./wordpress/plugins/badaround-core/
          server-dir: /staging.badaround.it/wp-content/plugins/badaround-core/
          dangerous-clean-slate: false
          log-level: minimal
      - name: Upload D3 Sentinelle template over FTPS (PASV IPv4)
        shell: bash
        env:
          FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
        run: |
          curl --fail --show-error --silent --insecure \
            --ssl-reqd --ftp-pasv --disable-epsv \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --user "$FTP_USER:$FTP_PASS" \
            --upload-file ./wordpress/themes/badaround-child/page-sentinelle.php \
            "ftp://$FTP_HOST/staging.badaround.it/wp-content/themes/badaround-child/page-sentinelle.php"
