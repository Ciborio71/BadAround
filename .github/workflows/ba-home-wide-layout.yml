name: BadAround home wide layout guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - tools/ba_home_wide_layout_release.py
      - .github/workflows/ba-home-wide-layout.yml
permissions:
  contents: read
concurrency:
  group: ba-home-wide-layout-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[home-wide-layout-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 29265ce44897b8f2eea45a953afcf1e6c811b50a
          path: prior-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Home rendering and release guard
        run: |
          npm ci --prefix tests --ignore-scripts
          php -l wordpress/themes/badaround-child/front-page.php
          php tests/home-proximity.php
          node --test tests/home-proximity.cjs
          python3 -m py_compile tools/ba_home_wide_layout_release.py
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install home wide layout UX
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_home_wide_layout_release.py
