name: RADAR-UX-04 targeted production deploy
on:
  push:
    branches: [release/production-mvp-01]
    paths:
      - 'ops/radar-ux-04-deploy-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: badaround-targeted-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
      EXPECTED_PARENT: 06a915f2cdd57dbde0fa73af312da498333fc64b
      EXPECTED_HEAD: 9f56f528093b77a5b690f2126edf93f7bf5ba416
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install TLS trust bundle
        run: |
          set -euo pipefail
          mkdir -p tls evidence
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/curl-chain.pem
      - name: Targeted one-file guarded deploy
        run: |
          python ops/radar-ux-04-deploy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-ux-04-deployment-evidence
          path: evidence/
          retention-days: 30
