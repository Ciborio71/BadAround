name: NF-UX-03 pinned three-file staging deploy and browser QA
on:
  push:
    branches: [deploy/nf-ux-03-emergency-staging]
permissions:
  contents: read
  actions: read
concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
      BA_PLAYWRIGHT_MODULE: /tmp/nf03-live/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Verify pinned candidate, dedicated CI and scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tls evidence
          git diff --exit-code 8077c291281ca35f8f26d6f78563de5d7fa87112 HEAD -- wordpress
          php -l wordpress/themes/badaround-child/inc/native-report.php
          node --check ops/nf03-live.cjs
          python - <<'CHECK'
          import os,json,urllib.request,subprocess
          req=urllib.request.Request('https://api.github.com/repos/Ciborio71/BadAround/actions/runs/39685154269',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req) as r:j=json.load(r)
          assert j['head_sha']=='8077c291281ca35f8f26d6f78563de5d7fa87112' and j['conclusion']=='success'
          actual=subprocess.check_output(['git','diff','--name-only','0d1db0d7fab7f2facbe6b07ccff002b9e884cade','8077c291281ca35f8f26d6f78563de5d7fa87112','--','wordpress']).decode().splitlines()
          assert sorted(actual)==sorted('wordpress/themes/badaround-child/'+p for p in ['inc/native-report.php','assets/js/native-report/wizard.js','assets/css/native-report.css'])
          CHECK
      - name: Prepare official browser test dependencies before any upload
        run: |
          npm install --prefix /tmp/nf03-live --no-save playwright@1.62.1
          node /tmp/nf03-live/node_modules/playwright/cli.js install --with-deps chromium
      - name: Provision officially signed chain and verify against runner root trust
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASS"
          ca=/etc/ssl/certs/ca-certificates.crt
          test -s "$ca"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          test "$(openssl x509 -in tls/yr2.pem -noout -subject)" = "subject=C = US, O = Let's Encrypt, CN = YR2"
          test "$(openssl x509 -in tls/yr-by-x1.pem -noout -subject)" = "subject=C = US, O = ISRG, CN = Root YR"
          openssl verify -CAfile "$ca" -untrusted tls/yr-by-x1.pem tls/yr2.pem
          cat tls/yr2.pem tls/yr-by-x1.pem > tls/untrusted.pem
          cat "$ca" tls/untrusted.pem > tls/curl-chain.pem
          timeout 30s openssl s_client -starttls ftp -connect "${FTP_HOST}:21" -servername "$FTP_TLS_NAME" -verify_hostname "$FTP_TLS_NAME" -verify_return_error -CAfile tls/curl-chain.pem < /dev/null > tls/handshake.log 2>&1
          grep -q 'Verify return code: 0 (ok)' tls/handshake.log
          echo 'FTPS server identity and chain VERIFIED; strict TLS remains enabled.'
      - name: Capture byte-exact rollback and certified backend hashes
        run: python ops/nf03-deploy.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: nf03-byte-exact-rollback
          path: evidence/
          retention-days: 90
          if-no-files-found: error
      - name: Read-only baseline live-browser regression with intercepted submission
        env:
          NF03_PHASE: before
        run: node ops/nf03-live.cjs
      - name: Upload only three files and certify staging; rollback immediately on failure
        shell: bash
        run: |
          set -euo pipefail
          python ops/nf03-deploy.py deploy
          if ! NF03_PHASE=after node ops/nf03-live.cjs; then
            python ops/nf03-deploy.py rollback
            exit 1
          fi
          if ! python ops/nf03-deploy.py verify; then
            python ops/nf03-deploy.py rollback
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf03-staging-certification
          path: evidence/
          retention-days: 90
          if-no-files-found: error
