name: BadAround comment submit width guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - tools/ba_comment_submit_width_release.py
      - .github/workflows/ba-comment-submit-width.yml
permissions:
  contents: read
concurrency:
  group: ba-comment-submit-width-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[comment-submit-width-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: e3c877898b63cbb7a168136e63095df69ebf7c54
          path: prior-source
          persist-credentials: false
      - name: Verify template and guarded deployment
        run: |
          python3 -m py_compile tools/ba_comment_submit_width_release.py
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install distinct comment submit width
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_comment_submit_width_release.py
