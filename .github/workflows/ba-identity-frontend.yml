name: BadAround Identity private QA frontend
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - tools/ba_identity_frontend_release.py
      - tests/test-ba-identity-wizard-api.cjs
      - .github/workflows/ba-identity-frontend.yml
permissions:
  contents: read
concurrency:
  group: badaround-production-frontend
  cancel-in-progress: false
jobs:
  tested-private-qa-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 789fcf1776b3768bc47dbb68e168b51124a25670
          path: prior-source
          persist-credentials: false
      - run: |
          node --test tests/test-ba-identity-wizard-api.cjs
          php -l wordpress/themes/badaround-child/inc/native-report.php
          php -l wordpress/themes/badaround-child/page-segnala-evento.php
          php -l wordpress/themes/badaround-child/single-ba_evento.php
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Deploy after exact baseline comparison
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_identity_frontend_release.py
