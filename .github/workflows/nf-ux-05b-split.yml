name: NF-UX-05B deterministic semantic certification and FTPS custody

on:
  push:
    branches: [qa/nf-ux-05b-split-certification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: synthetic-nf02b
          MARIADB_DATABASE: nf02b
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      BA_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=nf02b
      BA_TEST_DB_USER: root
      BA_TEST_DB_PASSWORD: synthetic-nf02b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, posix, fileinfo, pdo_mysql, pdo_sqlite, mbstring
      - name: Syntax and immutable boundary
        run: |
          set -euo pipefail
          find wordpress/plugins/badaround-core wordpress/themes/badaround-child -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/nf02b-lint.log
          git diff --check
          git diff --exit-code d0ac50bf4866b326943f3f4487b49fbe3d878d7b HEAD -- wordpress
          git diff --exit-code ba8586b2dbc0315fc251b0ec5fcc96c7a2426124 HEAD -- wordpress/plugins
          php -l wordpress/themes/badaround-child/inc/native-report.php
          node --check wordpress/themes/badaround-child/assets/js/native-report/model.js
          node --check wordpress/themes/badaround-child/assets/js/native-report/wizard.js
      - name: V1, V2, cross-version and consumer regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          tests=(native-report-f12 native-report-f13 native-report-f14 native-report-f15 native-report-f16 f1-14r-publication-contract geo-public-02-contract geo-public-02-publication-gate geo-public-04-moderation geo-public-05-publication geo-public-05-audit native-social-preference native-media-no-media-differential native-media-f17b native-media-f17c nf-ux-02b-v1-differential nf-ux-02b-v2 nf-ux-02b-media nf-ux-02c-immutability nf-ux-02c1-persistence nf-ux-02c1-v1-differential nf-ux-02c-resume-recovery nf-ux-02c2-recovery nf-ux-02c2-taxonomy-map)
          for test in "${tests[@]}"; do
            php "tests/${test}.php" | tee "test-results/${test}.log"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Conditional v2 matrix, Native payloads and media regressions
        run: |
          set -euo pipefail
          mkdir -p evidence/screenshots
          npm ci --prefix tests
          node --test --test-concurrency=1 tests/nf-ux-04-model.cjs tests/nf-ux-04-dom.cjs tests/nf-ux-04-service.cjs tests/native-media-f17d.cjs tests/native-media-f17d-dom.cjs tests/native-media-f17d-extra.cjs tests/native-media-f17e.cjs 2>&1 | tee evidence/dom.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf05b-semantic-evidence
          path: |
            test-results/
            evidence/
          retention-days: 90
  runtime-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: mkdir -p evidence tls
      - name: Provision officially signed chain and verify against runner root trust
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASS"
          ca=/etc/ssl/certs/ca-certificates.crt
          test -s "$ca"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          test "$(openssl x509 -in tls/yr2.pem -noout -subject)" = "subject=C = US, O = Let's Encrypt, CN = YR2"
          test "$(openssl x509 -in tls/yr-by-x1.pem -noout -subject)" = "subject=C = US, O = ISRG, CN = Root YR"
          openssl verify -CAfile "$ca" -untrusted tls/yr-by-x1.pem tls/yr2.pem
          cat tls/yr2.pem tls/yr-by-x1.pem > tls/untrusted.pem
          cat "$ca" tls/untrusted.pem > tls/curl-chain.pem
          timeout 30s openssl s_client -starttls ftp -connect "${FTP_HOST}:21" -servername "$FTP_TLS_NAME" -verify_hostname "$FTP_TLS_NAME" -verify_return_error -CAfile tls/curl-chain.pem < /dev/null > tls/handshake.log 2>&1
          grep -q 'Verify return code: 0 (ok)' tls/handshake.log
          echo 'FTPS server identity and chain VERIFIED; strict TLS remains enabled.'
      - name: Read-only FTPS hashes only, no staging HTTP/browser/probe
        run: python ops/nf05b-custody.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf05b-runtime-custody
          path: evidence/
          retention-days: 90
