name: UX-RESPONSIVE-01B.2 native QA
on:
  push:
    branches: [feature/ux-responsive-01b2-native]
    paths: ['ops/ux-responsive-01b2-launch.txt']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scope and syntax
        run: |
          set -euo pipefail
          git diff --check a38b1a50ee0ff2260a6b6ae906dcad20e8deff34 HEAD
          git diff --name-only a38b1a50ee0ff2260a6b6ae906dcad20e8deff34 HEAD -- wordpress | sort > runtime.txt
          cat > expected.txt <<'EOF'
          wordpress/themes/badaround-child/assets/css/native-report.css
          wordpress/themes/badaround-child/assets/js/native-report/smart-address.js
          wordpress/themes/badaround-child/assets/js/native-report/wizard.js
          EOF
          sort -o expected.txt expected.txt
          cmp runtime.txt expected.txt
          node --check wordpress/themes/badaround-child/assets/js/native-report/smart-address.js
          node --check wordpress/themes/badaround-child/assets/js/native-report/wizard.js
          grep -F "holder.replaceChildren();widget=null" wordpress/themes/badaround-child/assets/js/native-report/smart-address.js
          grep -F "ba-native-review-edit" wordpress/themes/badaround-child/assets/js/native-report/wizard.js
      - name: Native regressions
        run: |
          set -euo pipefail
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund
          node --test --test-concurrency=1             tests/f1-15b-r5-smart-address.cjs             tests/nf-ux-04-model.cjs             tests/nf-ux-04-service.cjs             tests/nf-ux-05*.cjs             tests/nf-ux-06*.cjs             tests/nf-ux-07*.cjs             tests/native-social-preference.cjs
