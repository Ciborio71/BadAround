name: Intelligence 02C data quality
on:
  push:
    branches:
      - feature/intelligence-02c-data-quality
  pull_request:
    branches:
      - feature/intelligence-02b-peak-candidates
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: |
          php -l wordpress/plugins/badaround-core/includes/class-badaround-intelligence-data-quality.php
          php -l tests/intelligence-02c-data-quality.php
          php tests/intelligence-02c-data-quality.php
