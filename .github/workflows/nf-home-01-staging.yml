name: NF-HOME-01 staging two-file deploy and guarded QA
on:
  push:
    branches: [deploy/nf-home-01-staging]
    paths: ['.github/workflows/nf-home-01-staging.yml', 'ops/nfhome01-deploy.py']
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: mkdir -p evidence tls
      - name: Provision officially signed chain and verify against runner root trust
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASS"
          ca=/etc/ssl/certs/ca-certificates.crt
          test -s "$ca"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          test "$(openssl x509 -in tls/yr2.pem -noout -subject)" = "subject=C = US, O = Let's Encrypt, CN = YR2"
          test "$(openssl x509 -in tls/yr-by-x1.pem -noout -subject)" = "subject=C = US, O = ISRG, CN = Root YR"
          openssl verify -CAfile "$ca" -untrusted tls/yr-by-x1.pem tls/yr2.pem
          cat tls/yr2.pem tls/yr-by-x1.pem > tls/untrusted.pem
          cat "$ca" tls/untrusted.pem > tls/curl-chain.pem
          timeout 30s openssl s_client -starttls ftp -connect "${FTP_HOST}:21" -servername "$FTP_TLS_NAME" -verify_hostname "$FTP_TLS_NAME" -verify_return_error -CAfile tls/curl-chain.pem < /dev/null > tls/handshake.log 2>&1
          grep -q 'Verify return code: 0 (ok)' tls/handshake.log
          echo 'FTPS server identity and chain VERIFIED; strict TLS remains enabled.'
      - name: Baseline custody
        run: python ops/nfhome01-deploy-custody.py
      - name: Byte exact rollback before upload
        run: python ops/nfhome01-deploy.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: nfhome01-rollback-before-upload
          path: evidence/
          retention-days: 90
      - name: Deploy ONLY two Home runtime files
        run: python ops/nfhome01-deploy.py deploy
      - name: Unchanged Core Native backend and map custody
        env:
          HOME_REF: a4ef16aa067afc94a96cacd55a46a62d1248ed93
        run: python ops/nfhome01-deploy-custody.py
      - uses: actions/upload-artifact@v4
        with:
          name: nfhome01-after-upload-custody
          path: evidence/
          retention-days: 90
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Fresh six-width responsive equivalence
        env:
          BA_PLAYWRIGHT_MODULE: /tmp/nf05c/node_modules/playwright
        run: |
          npm install --prefix /tmp/nf05c playwright@1.56.1
          /tmp/nf05c/node_modules/.bin/playwright install --with-deps chromium
          node ops/nfhome01-cards.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: nfhome01-fresh-responsive
          path: evidence/
          retention-days: 90
      - name: Guarded browser QA verdict or automatic rollback
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ops/nfhome01-deploy.py watch
      - name: Rollback on any failure
        if: failure() || cancelled()
        run: python ops/nfhome01-deploy.py rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfhome01-final-deploy-evidence
          path: evidence/
          retention-days: 90
