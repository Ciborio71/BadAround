  identity-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ba_identity_ci
          MYSQL_USER: ba_ci
          MYSQL_PASSWORD: local-ci-only-password
          MYSQL_ROOT_PASSWORD: local-ci-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal-ci-root-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout isolated prototype tests
        uses: actions/checkout@v4
        with:
          ref: feature/ba-identity-01c-dormant-20261103
          path: prototype-source
          persist-credentials: false
      - name: Overlay verified production modules and new dormant bridge
        run: |
          set -eu
          src=wordpress/plugins/badaround-core/identity-dormant
          dest=prototype-source/prototypes/ba-identity-01c
          test -d "$src"
          test -d "$dest"
          count=0
          for file in "$src"/*.php "$src"/*.js; do
            test -f "$file" || continue
            cp "$file" "$dest/"
            count=$((count+1))
          done
          test "$count" -eq 86
          echo "PRODUCTION_SOURCE_TEST_OVERLAY=PASS count=$count"
      - name: Prepare PHP 8.3 with MySQL support
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_mysql, pdo_sqlite, pcntl
          coverage: none
      - name: Ephemeral MySQL integration
        env:
          BA_TEST_DB_DSN: "mysql:host=127.0.0.1;port=3306;dbname=ba_identity_ci;charset=utf8mb4"
          BA_TEST_DB_USER: ba_ci
          BA_TEST_DB_PASS: local-ci-only-password
        run: |
          php -r 'foreach (["mbstring", "openssl", "pdo_mysql", "pcntl"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "Missing ".$e.PHP_EOL); exit(1); } }'
