name: BadAround production backup safety inventory
on:
  push:
    branches:
      - reconcile/identity-production-baseline-20261104
    paths:
      - .github/workflows/ba-production-backup-preflight.yml
permissions:
  contents: read
jobs:
  backup-readonly:
    if: "github.event.head_commit.message == 'audit: run one-shot production backup inventory'"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check inventory script syntax
        run: python3 -m py_compile tools/ba_production_backup_readonly_preflight.py
      - name: Inventory backup candidates read only
        env:
          FTP_HOST: '46.231.24.137'
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
        run: python3 tools/ba_production_backup_readonly_preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ba-production-backup-preflight
          path: ba-production-backup-preflight.json
          retention-days: 7
