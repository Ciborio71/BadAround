      - name: Overlay verified production modules and new dormant bridge
        run: |
          set -eu
          src=wordpress/plugins/badaround-core/identity-dormant
          dest=prototype-source/prototypes/ba-identity-01c
          test -d "$src"
          test -d "$dest"
          count=0
          for file in "$src"/*.php "$src"/*.js; do
            test -f "$file" || continue
            cp "$file" "$dest/"
            count=$((count+1))
          done
          test "$count" -eq 83
          echo "PRODUCTION_SOURCE_TEST_OVERLAY=PASS count=$count"
      - name: Prepare PHP 8.3 with MySQL support
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_mysql, pcntl
          coverage: none
