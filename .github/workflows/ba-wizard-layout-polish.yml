name: BadAround wizard layout polish guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - tools/ba_wizard_layout_polish_release.py
      - .github/workflows/ba-wizard-layout-polish.yml
permissions:
  contents: read
concurrency:
  group: ba-wizard-layout-polish-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[wizard-layout-polish-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: efb71403e5c348cd384b49db37cce6647b8e691c
          path: prior-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify online identity choice precedes private names
        run: |
          npm ci --prefix tests --ignore-scripts
          node --check wordpress/themes/badaround-child/assets/js/native-report/wizard.js
          php -l wordpress/themes/badaround-child/inc/native-report.php
          php -l wordpress/themes/badaround-child/template-parts/native-report/step.php
          node --check wordpress/themes/badaround-child/assets/js/native-report/smart-address.js
          node --check wordpress/themes/badaround-child/assets/js/native-report/location-map.js
          node --check wordpress/themes/badaround-child/assets/js/native-report/model.js
          php -l wordpress/themes/badaround-child/functions.php
          php -l wordpress/themes/badaround-child/header.php
          php -l wordpress/themes/badaround-child/footer.php
          php tests/geo-prec-01-publication.php
          php tests/geo-area-01-publication.php
          node --test tests/f1-15b-r5-smart-address.cjs tests/native-report-f16-dom.cjs tests/native-report-f19-ux.cjs tests/geo-public-03-choice.cjs tests/geo-area-01-model.cjs tests/wizard-presentation-20261112.cjs tests/test-ba-access-wizard-dom.cjs
          python3 -m py_compile tools/ba_wizard_layout_polish_release.py
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
      - name: Verify responsive presentation with the canonical fixture origin
        run: |
          npm install --no-save --prefix tests playwright-core
          BA_CHROMIUM=/usr/bin/google-chrome node tests/wizard-presentation-browser.cjs
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install wizard layout polish UX
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_wizard_layout_polish_release.py
