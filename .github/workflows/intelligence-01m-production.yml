name: INTELLIGENCE-01M guarded passive Core deploy
on:
  push:
    branches: [release/production-mvp-01]
    paths:
      - 'ops/intelligence-01m-deploy-trigger.txt'
permissions:
  contents: read
concurrency:
  group: badaround-targeted-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
      EXPECTED_PARENT: d8a12d8c77615a9f81f0ab0ba029faed39cb97cb
      EXPECTED_HEAD: 14a46481e33ecf41b7295f558a79b8f4ec59dabf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install TLS trust bundle
        run: |
          set -euo pipefail
          mkdir -p tls evidence
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/curl-chain.pem
      - name: Validate passive Core PHP and bootstrap
        run: |
          php -l wordpress/plugins/badaround-core/badaround-core.php
          php -l wordpress/plugins/badaround-core/includes/class-badaround-intelligence-read-model.php
          php -r '$s=file_get_contents("wordpress/plugins/badaround-core/badaround-core.php"); if(substr_count($s,"class-badaround-intelligence-read-model.php")!==1)exit(2);'
      - name: Guarded two-file deploy
        run: python3 ops/intelligence-01m-deploy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intelligence-01m-deployment-evidence
          path: evidence/
          retention-days: 30
