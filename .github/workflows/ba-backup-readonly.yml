name: BadAround private backup read-only verification
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths: [.github/workflows/ba-backup-readonly.yml, tools/ba_backup_readonly.py]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ba-backup-readonly
  cancel-in-progress: false
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[backup-readonly]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate private archive inspector
        run: python3 -m py_compile tools/ba_backup_readonly.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Check archive without modifying the site
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_backup_readonly.py
