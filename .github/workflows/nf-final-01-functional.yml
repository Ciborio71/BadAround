name: NF-FINAL-01 current functional audit (read-only runtime)
on:
  push:
    branches: [qa/nf-final-01-functional-certification]
    paths: ['.github/workflows/nf-final-01-functional.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, gd
      - name: Dependencies
        run: npm ci --prefix tests
      - name: Prepare read-only custody
        run: mkdir -p tls evidence/nf-final-01
      - name: Provision officially signed chain and verify against runner root trust
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASS"
          ca=/etc/ssl/certs/ca-certificates.crt
          test -s "$ca"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          test "$(openssl x509 -in tls/yr2.pem -noout -subject)" = "subject=C = US, O = Let's Encrypt, CN = YR2"
          test "$(openssl x509 -in tls/yr-by-x1.pem -noout -subject)" = "subject=C = US, O = ISRG, CN = Root YR"
          openssl verify -CAfile "$ca" -untrusted tls/yr-by-x1.pem tls/yr2.pem
          cat tls/yr2.pem tls/yr-by-x1.pem > tls/untrusted.pem
          cat "$ca" tls/untrusted.pem > tls/curl-chain.pem
          timeout 30s openssl s_client -starttls ftp -connect "${FTP_HOST}:21" -servername "$FTP_TLS_NAME" -verify_hostname "$FTP_TLS_NAME" -verify_return_error -CAfile tls/curl-chain.pem < /dev/null > tls/handshake.log 2>&1
          grep -q 'Verify return code: 0 (ok)' tls/handshake.log
          echo 'FTPS server identity and chain VERIFIED; strict TLS remains enabled.'
      - name: Current staging byte custody (no upload)
        run: python ops/nf-final-01-readonly-custody.py
      - name: Native functional DOM, state, retry, geo and privacy
        run: |
          set -euo pipefail
          node --test tests/nf-ux-04-model.cjs tests/nf-ux-04-dom.cjs tests/nf-ux-04-service.cjs tests/nf-ux-07-submit-feedback.cjs tests/geo-area-01-model.cjs tests/geo-public-03-choice.cjs tests/geo-public-06-rendering.cjs tests/native-social-preference.cjs tests/sf9-public-privacy-boundary.cjs tests/f1-15b-r5-smart-address.cjs tests/native-media-f17d-dom.cjs tests/native-media-f17d-extra.cjs | tee evidence/nf-final-01/js-tests.txt
      - name: Backend canonical, persistence, security and regressions
        run: |
          set -euo pipefail
          for f in native-report-f13 native-report-f14 native-report-f15 geo-area-01-publication geo-prec-01-publication f1-15a3-territory geo-area-01-consumers geo-prec-01-moderation geo-priv-03a5a-classic-form native-social-preference f1-14r-publication-contract f1-14r-consumers ui-admin-01-scope ui-admin-01-rejection; do
            echo "RUN $f" | tee -a evidence/nf-final-01/php-tests.txt
            php tests/$f.php >> evidence/nf-final-01/php-tests.txt
          done
      - name: PHP syntax
        run: find wordpress/plugins/badaround-core wordpress/themes/badaround-child -name '*.php' -type f -print0 | xargs -0 -n1 php -l > evidence/nf-final-01/php-lint.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf-final-01-current-functional-audit
          path: evidence/nf-final-01/
          retention-days: 90
