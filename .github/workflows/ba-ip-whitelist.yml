name: BadAround bounded IP whitelist and maintenance admission
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - tools/ba_ip_whitelist_release.py
      - .github/workflows/ba-ip-whitelist.yml
permissions:
  contents: read
concurrency:
  group: ba-ip-whitelist-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[ip-whitelist-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ba_identity_ci
          MYSQL_USER: ba_ci
          MYSQL_PASSWORD: local-ci-only-password
          MYSQL_ROOT_PASSWORD: local-ci-root-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal-ci-root-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 24c77d23050d5acb172b663784586504e1275817
          path: prior-source
          persist-credentials: false
      - name: Verify exact peers, forged headers, preserved secrets and maintenance isolation
        env:
          BA_TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=ba_identity_ci;charset=utf8mb4'
          BA_TEST_DB_USER: ba_ci
          BA_TEST_DB_PASS: local-ci-only-password
        run: |
          php -l wordpress/themes/badaround-child/functions.php
          php tests/test-ba-private-config-mysql.php
          php tests/maintenance-private-qa.php
          php tests/test-ba-access-portal.php
          php tests/event-dynamic-seo.php
          python3 -m py_compile tools/ba_ip_whitelist_release.py
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install bounded private inbox support preserving existing configuration
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_ip_whitelist_release.py
