name: GEO-PRIV-03A — Isolated Staging Deploy with Remote Rollback Gate
on:
  push:
    branches: [deploy/geo-priv-03a-staging]
permissions:
  contents: read
concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false
jobs:
  isolated:
    runs-on: ubuntu-latest
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      DEPLOY_FILE: class-badaround-moderation-admin.php
      EXPECTED_CANDIDATE: 65e04fc32ce912693869e3e08b2ad1e03e02f13c
      SOCIAL_BASE: 16b4c67180f6b768b1bc2fedfe4efbd9dad223a2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 65e04fc32ce912693869e3e08b2ad1e03e02f13c
          fetch-depth: 0
      - name: Fail closed on unexpected candidate or scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          php -l wordpress/plugins/badaround-core/includes/class-badaround-moderation-admin.php
          php -l wordpress/plugins/badaround-core/includes/class-badaround-publication-service.php
          php tests/geo-priv-03a-published-save.php
          php tests/f1-14r-publication-contract.php
          php tests/f1-14r-consumers.php
          php tests/native-social-preference.php
      - name: Prepare one-file payload, certified expected old file and hashes
        run: |
          set -euo pipefail
          mkdir -p new old rollback
          cp wordpress/plugins/badaround-core/includes/"$DEPLOY_FILE" new/"$DEPLOY_FILE"
          git show "$SOCIAL_BASE":wordpress/plugins/badaround-core/includes/"$DEPLOY_FILE" > old/"$DEPLOY_FILE"
          test "$(find new -type f | wc -l)" -eq 1
          test "$(find old -type f | wc -l)" -eq 1
          sha256sum new/"$DEPLOY_FILE" old/"$DEPLOY_FILE" > candidate-manifest.txt
      - name: Prepare trusted FTPS certificate authority
        env:
          STAGING_FTPS_CA_B64: ${{ secrets.STAGING_FTPS_CA_B64 }}
        run: |
          set -euo pipefail
          # The optional CA must be provisioned out-of-band and reviewed by the hosting operator.
          # Never trust the remote certificate by downloading it during this job.
          if [ -n "${STAGING_FTPS_CA_B64}" ]; then
            printf '%s' "${STAGING_FTPS_CA_B64}" | base64 --decode > "$RUNNER_TEMP/staging-ftps-ca.pem"
            test -s "$RUNNER_TEMP/staging-ftps-ca.pem"
            openssl crl2pkcs7 -nocrl -certfile "$RUNNER_TEMP/staging-ftps-ca.pem" | openssl pkcs7 -print_certs -noout >/dev/null
            echo "FTPS_CA_FILE=$RUNNER_TEMP/staging-ftps-ca.pem" >> "$GITHUB_ENV"
            echo 'Pre-approved hosting CA configured. TLS verification is mandatory.'
          else
            echo 'Using system CA trust store. If certificate chain is incomplete, the host must repair it or provide approved STAGING_FTPS_CA_B64.'
          fi
      - name: Capture ACTUAL remote bytes and verify certified old file
        id: backup
        env:
          REMOTE: ftp://${{ secrets.STAGING_SFTP_HOST }}/staging.badaround.it/wp-content/plugins/badaround-core/includes/class-badaround-moderation-admin.php
        run: |
          set -euo pipefail
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASS"
          ca_args=()
          if [ -n "${FTPS_CA_FILE:-}" ]; then ca_args+=(--cacert "$FTPS_CA_FILE"); fi
          curl --fail --show-error --silent --retry 2 --ssl-reqd "${ca_args[@]}" --user "$FTP_USER:$FTP_PASS" "$REMOTE" -o rollback/"$DEPLOY_FILE"
          test -s rollback/"$DEPLOY_FILE"
          cmp -s rollback/"$DEPLOY_FILE" old/"$DEPLOY_FILE" || {
            echo 'STOP: staging bytes differ from certified Social baseline. NO DEPLOY.'; exit 1;
          }
          sha256sum rollback/"$DEPLOY_FILE" >> candidate-manifest.txt
          echo 'Actual remote rollback bytes verified against certified baseline.'
      - name: Store exact backup artifact before upload
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo-priv-03a-remote-rollback-${{ github.run_id }}
          path: |
            rollback/
            candidate-manifest.txt
          retention-days: 30
          if-no-files-found: error
      - name: Upload exactly one staging file over verified FTPS
        id: upload
        continue-on-error: true
        env:
          REMOTE: ftp://${{ secrets.STAGING_SFTP_HOST }}/staging.badaround.it/wp-content/plugins/badaround-core/includes/class-badaround-moderation-admin.php
        run: |
          set -euo pipefail
          test "${{ steps.backup.outcome }}" = success
          test "${{ steps.artifact.outcome }}" = success
          cmp -s rollback/"$DEPLOY_FILE" old/"$DEPLOY_FILE"
          ca_args=()
          if [ -n "${FTPS_CA_FILE:-}" ]; then ca_args+=(--cacert "$FTPS_CA_FILE"); fi
          curl --fail --show-error --silent --ssl-reqd "${ca_args[@]}" --user "$FTP_USER:$FTP_PASS" --upload-file new/"$DEPLOY_FILE" "$REMOTE"
      - name: Verify deployed bytes
        id: verify
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        env:
          REMOTE: ftp://${{ secrets.STAGING_SFTP_HOST }}/staging.badaround.it/wp-content/plugins/badaround-core/includes/class-badaround-moderation-admin.php
        run: |
          set -euo pipefail
          ca_args=()
          if [ -n "${FTPS_CA_FILE:-}" ]; then ca_args+=(--cacert "$FTPS_CA_FILE"); fi
          curl --fail --show-error --silent --ssl-reqd "${ca_args[@]}" --user "$FTP_USER:$FTP_PASS" "$REMOTE" -o remote-verified.php
          cmp -s remote-verified.php new/"$DEPLOY_FILE"
          sha256sum remote-verified.php
          echo 'Remote file is byte-exact candidate.'
      - name: Restore certified original when upload or verification fails
        id: restore
        if: always() && steps.backup.outcome == 'success' && steps.artifact.outcome == 'success' && (steps.upload.outcome == 'failure' || (steps.upload.outcome == 'success' && steps.verify.outcome != 'success'))
        continue-on-error: true
        env:
          REMOTE: ftp://${{ secrets.STAGING_SFTP_HOST }}/staging.badaround.it/wp-content/plugins/badaround-core/includes/class-badaround-moderation-admin.php
        run: |
          set -euo pipefail
          cmp -s rollback/"$DEPLOY_FILE" old/"$DEPLOY_FILE"
          ca_args=()
          if [ -n "${FTPS_CA_FILE:-}" ]; then ca_args+=(--cacert "$FTPS_CA_FILE"); fi
          curl --fail --show-error --silent --ssl-reqd "${ca_args[@]}" --user "$FTP_USER:$FTP_PASS" --upload-file rollback/"$DEPLOY_FILE" "$REMOTE"
          curl --fail --show-error --silent --ssl-reqd "${ca_args[@]}" --user "$FTP_USER:$FTP_PASS" "$REMOTE" -o remote-restored.php
          cmp -s remote-restored.php rollback/"$DEPLOY_FILE"
          echo 'Exact original restored and verified.'
      - name: Final gate
        if: always()
        run: |
          set -euo pipefail
          if [ '${{ steps.backup.outcome }}' != 'success' ] || [ '${{ steps.artifact.outcome }}' != 'success' ]; then
            echo 'STOP: no verified backup/artifact. NO UPLOAD PERMITTED.'; exit 1
          fi
          if [ '${{ steps.upload.outcome }}' != 'success' ] || [ '${{ steps.verify.outcome }}' != 'success' ]; then
            echo 'STOP: upload/verification failed; inspect verified restoration status.'; exit 1
          fi
          echo 'ISOLATED STAGING FILE BYTE VERIFIED. REAL APPLICATION QA STILL REQUIRED.'
