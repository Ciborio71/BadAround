name: PERF-POLISH-01 map loading QA
on:
  push:
    branches: [feature/perf-polish-01-maps]
    paths: ['ops/perf-polish-01-launch.txt']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scope syntax and targeted regressions
        run: |
          set -euo pipefail
          git diff --check c54a924ed98cac9e3051fd38e26eed2c10d89a23 HEAD
          git diff --name-only c54a924ed98cac9e3051fd38e26eed2c10d89a23 HEAD -- wordpress | sort > runtime.txt
          printf '%s\n' wordpress/themes/badaround-child/assets/js/map.js > expected.txt
          cmp runtime.txt expected.txt
          node --check wordpress/themes/badaround-child/assets/js/map.js
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund
          node --test --test-concurrency=1             tests/perf-polish-01-map-loading.cjs             tests/geo-public-06-rendering.cjs             tests/map-controls-provider.cjs             tests/sf9-public-privacy-boundary.cjs
