name: UX-RESPONSIVE-01B.3A legal skip target staging deploy
on:
  push:
    branches: [deploy/ux-responsive-01b3a-staging]
    paths: ['ops/ux-responsive-01b3a-launch.txt']
permissions:
  contents: read
  actions: read
concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
      CANDIDATE: c54a924ed98cac9e3051fd38e26eed2c10d89a23
      QA_RUN: 40111627615
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c54a924ed98cac9e3051fd38e26eed2c10d89a23
          fetch-depth: 0
      - name: Verify QA and prepare files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request('https://api.github.com/repos/Ciborio71/BadAround/actions/runs/'+os.environ['QA_RUN'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r:j=json.load(r)
          assert j['head_sha']==os.environ['CANDIDATE'] and j['conclusion']=='success'
          PY
          mkdir -p old new rollback verified tls
          mkdir -p old/themes/badaround-child/assets/css new/themes/badaround-child/assets/css rollback/themes/badaround-child/assets/css verified/themes/badaround-child/assets/css
          mkdir -p old/themes/badaround-child new/themes/badaround-child rollback/themes/badaround-child verified/themes/badaround-child
          git show e7a6b191c60e49ba5f83e6f3a30008f821a05704:wordpress/themes/badaround-child/header.php > old/themes/badaround-child/header.php
          git show 86d12960b041cedc8b2272c6b18d6a714b0fe8c2:wordpress/themes/badaround-child/assets/css/legal.css > old/themes/badaround-child/assets/css/legal.css
          git show "$CANDIDATE":wordpress/themes/badaround-child/header.php > new/themes/badaround-child/header.php
          git show "$CANDIDATE":wordpress/themes/badaround-child/assets/css/legal.css > new/themes/badaround-child/assets/css/legal.css
          printf '%s\n' themes/badaround-child/header.php themes/badaround-child/assets/css/legal.css > files.txt
      - name: Verify FTPS TLS
        run: |
          set -euo pipefail
          ca=/etc/ssl/certs/ca-certificates.crt
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat tls/yr2.pem tls/yr-by-x1.pem > tls/untrusted.pem
          cat "$ca" tls/untrusted.pem > tls/curl-chain.pem
          openssl verify -CAfile "$ca" -untrusted tls/yr-by-x1.pem tls/yr2.pem
      - name: Capture current remote baseline
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            remote="ftp://${FTP_TLS_NAME}:21/staging.badaround.it/wp-content/$file"
            curl --fail --silent --show-error --ssl-reqd --cacert tls/curl-chain.pem --connect-to "${FTP_TLS_NAME}:21:${FTP_HOST}:21" --user "$FTP_USER:$FTP_PASS" "$remote" -o "rollback/$file"
            cmp "rollback/$file" "old/$file"
          done < files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ux-responsive-01b3a-rollback
          path: rollback/
          retention-days: 90
      - name: Upload two files
        id: upload
        continue-on-error: true
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            remote="ftp://${FTP_TLS_NAME}:21/staging.badaround.it/wp-content/$file"
            curl --fail --silent --show-error --ssl-reqd --cacert tls/curl-chain.pem --connect-to "${FTP_TLS_NAME}:21:${FTP_HOST}:21" --user "$FTP_USER:$FTP_PASS" --upload-file "new/$file" "$remote"
          done < files.txt
      - name: Verify candidate bytes
        id: verify
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            remote="ftp://${FTP_TLS_NAME}:21/staging.badaround.it/wp-content/$file"
            curl --fail --silent --show-error --ssl-reqd --cacert tls/curl-chain.pem --connect-to "${FTP_TLS_NAME}:21:${FTP_HOST}:21" --user "$FTP_USER:$FTP_PASS" "$remote" -o "verified/$file"
            cmp "verified/$file" "new/$file"
          done < files.txt
      - name: Rollback on failure
        if: always() && steps.upload.outcome != 'skipped' && (steps.upload.outcome == 'failure' || steps.verify.outcome != 'success')
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            remote="ftp://${FTP_TLS_NAME}:21/staging.badaround.it/wp-content/$file"
            curl --fail --silent --show-error --ssl-reqd --cacert tls/curl-chain.pem --connect-to "${FTP_TLS_NAME}:21:${FTP_HOST}:21" --user "$FTP_USER:$FTP_PASS" --upload-file "rollback/$file" "$remote"
          done < files.txt
      - name: Final gate
        if: always()
        run: |
          test '${{ steps.upload.outcome }}' = success
          test '${{ steps.verify.outcome }}' = success
