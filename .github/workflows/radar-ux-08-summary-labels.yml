name: Radar UX08 summary labels
on:
  push:
    branches:
      - feature/radar-ux-08-summary-labels
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: |
          php -l wordpress/plugins/badaround-core/includes/class-badaround-radar-window-renderer.php
          php tests/radar-public-06-window-renderer.php
          php tests/radar-ux-08-summary-labels.php
