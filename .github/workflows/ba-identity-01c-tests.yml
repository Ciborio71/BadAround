name: BA-IDENTITY-01C isolated primitive tests
on:
  push:
    branches:
      - feature/ba-identity-01c-dormant-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-primitives:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l prototypes/ba-identity-01c/challenge-primitives.php
          php -l prototypes/ba-identity-01c/test-challenge-primitives.php
          php -l prototypes/ba-identity-01c/challenge-store.php
          php -l prototypes/ba-identity-01c/test-challenge-store.php
          php -l prototypes/ba-identity-01c/ownership-policy.php
          php -l prototypes/ba-identity-01c/test-ownership-policy.php
          php -l prototypes/ba-identity-01c/mysql-challenge-store.php
          php -l prototypes/ba-identity-01c/session-policy.php
          php -l prototypes/ba-identity-01c/test-session-policy.php
          php -l prototypes/ba-identity-01c/mysql-session-store.php
      - name: OTP state machine tests
        run: |
          php prototypes/ba-identity-01c/test-challenge-primitives.php
          php prototypes/ba-identity-01c/test-challenge-store.php
          php prototypes/ba-identity-01c/test-ownership-policy.php
          php prototypes/ba-identity-01c/test-session-policy.php
