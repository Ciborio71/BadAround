name: BadAround verification structured data guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - tools/ba_verification_structured_data_release.py
      - .github/workflows/ba-verification-structured-data.yml
permissions:
  contents: read
concurrency:
  group: ba-verification-structured-data-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[verification-structured-data-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 6fe247c78d542aa40b64908865783fef81a570e7
          path: prior-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify contribution interaction and map regressions
        run: |
          npm ci --prefix tests --ignore-scripts
          php -l wordpress/themes/badaround-child/functions.php
          php -l wordpress/themes/badaround-child/inc/event-structured-data.php
          php tests/event-structured-data.php
          php tests/event-section-headings.php
          php tests/test-ba-event-dates.php
          php tests/test-ba-event-public-details.php
          php tests/test-ba-community-review.php
          php tests/event-gallery.php
          php tests/geo-prec-01-publication.php
          php tests/geo-area-01-publication.php
          php tests/contributions-e1.php
          php tests/contributions-e2.php
          php tests/contributions-e3.php
          php tests/contributions-e5.php
          BA_MEDIA_BASELINE_DIR="$GITHUB_WORKSPACE/prior-source/wordpress/themes/badaround-child/assets/js/native-report" npm test --prefix tests
          node --test tests/contribution-ux.cjs tests/event-detail-lazy-map.cjs tests/home-proximity.cjs tests/test-ba-community-ui.cjs
          python3 -m py_compile tools/ba_verification_structured_data_release.py
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install verification structured data UX
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_verification_structured_data_release.py
