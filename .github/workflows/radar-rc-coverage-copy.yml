name: Radar private QA coverage display
on:
  push:
    branches:
      - feature/radar-rc-coverage-clarity
  pull_request:
    branches:
      - release-candidate/radar-private-wordpress-qa-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: |
          php -l wordpress/plugins/badaround-core/includes/class-badaround-radar-private-qa.php
          php -l tests/radar-rc-coverage-copy.php
          php tests/radar-rc-coverage-copy.php
