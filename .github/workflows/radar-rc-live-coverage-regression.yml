name: Radar observed date coverage regression
on:
  push:
    branches:
      - feature/radar-rc-snapshot-guard
  pull_request:
    branches:
      - feature/radar-rc-coverage-clarity
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: |
          php -l tests/radar-rc-live-coverage-regression.php
          php tests/radar-rc-live-coverage-regression.php
