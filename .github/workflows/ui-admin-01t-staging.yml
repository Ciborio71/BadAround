name: UI-ADMIN-01T guarded two-file staging deployment
on:
  push:
    branches: [deploy/ui-admin-01t-staging]
    paths: ['ops/ui-admin-01t-launch.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pinned candidate and successful pre-deploy CI
        run: |
          mkdir -p tls evidence/ui-admin-01t
          git diff --exit-code 0c2863b2a1bfbfb1e5c9641c78ba8d28bd21f21c HEAD -- wordpress
          python - <<'CHECK'
          import urllib.request,json,os
          req=urllib.request.Request('https://api.github.com/repos/Ciborio71/BadAround/actions/runs/40031438660',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req) as r:d=json.load(r)
          assert d['head_sha']=='0c2863b2a1bfbfb1e5c9641c78ba8d28bd21f21c' and d['conclusion']=='success'
          CHECK
      - name: Provision officially signed chain and verify against runner root trust
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASS"
          ca=/etc/ssl/certs/ca-certificates.crt
          test -s "$ca"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          test "$(openssl x509 -in tls/yr2.pem -noout -subject)" = "subject=C = US, O = Let's Encrypt, CN = YR2"
          test "$(openssl x509 -in tls/yr-by-x1.pem -noout -subject)" = "subject=C = US, O = ISRG, CN = Root YR"
          openssl verify -CAfile "$ca" -untrusted tls/yr-by-x1.pem tls/yr2.pem
          cat tls/yr2.pem tls/yr-by-x1.pem > tls/untrusted.pem
          cat "$ca" tls/untrusted.pem > tls/curl-chain.pem
          timeout 30s openssl s_client -starttls ftp -connect "${FTP_HOST}:21" -servername "$FTP_TLS_NAME" -verify_hostname "$FTP_TLS_NAME" -verify_return_error -CAfile tls/curl-chain.pem < /dev/null > tls/handshake.log 2>&1
          grep -q 'Verify return code: 0 (ok)' tls/handshake.log
          echo 'FTPS server identity and chain VERIFIED; strict TLS remains enabled.'
      - name: Exact two-target duplicate gate, rollback copies, runtime custody
        run: python ops/ui-admin-01t-deploy.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: ui-admin-01t-pre-upload-custody
          path: evidence/ui-admin-01t/
          retention-days: 90
      - name: Wait for live pre-upload health gate; upload only two pinned files
        run: python ops/ui-admin-01t-deploy.py deploy
      - uses: actions/upload-artifact@v4
        with:
          name: ui-admin-01t-remote-hashes
          path: evidence/ui-admin-01t/
          retention-days: 90
      - name: Wait for live admin certification; rollback on failure
        run: python ops/ui-admin-01t-deploy.py watch
      - name: Immediate rollback on failure or cancellation
        if: failure() || cancelled()
        run: python ops/ui-admin-01t-deploy.py rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-admin-01t-final-custody
          path: evidence/ui-admin-01t/
          retention-days: 90
