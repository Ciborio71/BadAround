name: BadAround event gallery and lazy map guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - wordpress/themes/badaround-child/inc/event-gallery.php
      - wordpress/themes/badaround-child/assets/js/event-gallery.js
      - wordpress/mu-plugins/badaround-performance-observer.php
      - tools/ba_event_gallery_release.py
      - .github/workflows/ba-event-gallery.yml
permissions:
  contents: read
concurrency:
  group: ba-event-gallery-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[event-gallery-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 5582322bcb2d80eb7ccd5b4f6e22daba5887475d
          path: prior-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify gallery, privacy, detail map and Home regression
        run: |
          npm ci --prefix tests --ignore-scripts
          php tests/event-gallery.php
          php tests/page-performance.php
          php tests/test-ba-event-public-details.php
          php tests/test-ba-event-seo.php
          php tests/geo-prec-01-publication.php
          php tests/geo-area-01-publication.php
          php tests/test-ba-community-review.php
          node --test tests/event-gallery.cjs tests/event-detail-lazy-map.cjs tests/home-proximity.cjs
          node --check wordpress/themes/badaround-child/assets/js/map.js
          node --check wordpress/themes/badaround-child/assets/js/event-gallery.js
          php -l wordpress/themes/badaround-child/inc/event-gallery.php
          php -l wordpress/themes/badaround-child/functions.php
          php -l wordpress/themes/badaround-child/template-parts/single-event-layout.php
          php -l wordpress/mu-plugins/badaround-performance-observer.php
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
          python3 -m py_compile tools/ba_event_gallery_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install scoped runtime files with verified backup
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_event_gallery_release.py
