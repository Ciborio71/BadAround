name: Deploy reconciled to staging

on:
  workflow_dispatch:
    inputs:
      deployment_track:
        description: "Authorized staging deployment track"
        required: true
        default: release
        type: choice
        options:
          - release
          - f17_qa
          - f110_freeze
      expected_sha:
        description: "Exact SHA authorized for the selected deployment track"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate authorized staging track
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve authorized track
        id: track
        shell: bash
        env:
          DEPLOYMENT_TRACK: ${{ inputs.deployment_track }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_TRACK" in
            release)
              REF='release/mvp-reconciled'
              APPROVED_SHA='27be97f7468a9fe1ac41b4482e22e98307ac0c0a'
              CORE_VERSION='0.18.0'
              SCHEMA_VERSION='1.9.0'
              ;;
            f17_qa)
              REF='recovery/native-media-f17-qa-rc'
              APPROVED_SHA='d6156e236d35da062c7f444bc73442e2905db54e'
              CORE_VERSION='0.18.0'
              SCHEMA_VERSION='1.9.0'
              ;;
            f110_freeze)
              REF='reconcile/f1-10-native-wizard-freeze'
              APPROVED_SHA='27be97f7468a9fe1ac41b4482e22e98307ac0c0a'
              CORE_VERSION='0.18.0'
              SCHEMA_VERSION='1.9.0'
              ;;
            *) echo 'Unauthorized deployment track' >&2; exit 1 ;;
          esac
          test "$EXPECTED_SHA" = "$APPROVED_SHA"
          {
            echo "ref=$REF"
            echo "approved_sha=$APPROVED_SHA"
            echo "core_version=$CORE_VERSION"
            echo "schema_version=$SCHEMA_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout authorized track
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.track.outputs.ref }}
          fetch-depth: 1

      - name: Verify approved track SHA
        shell: bash
        env:
          DEPLOYMENT_TRACK: ${{ inputs.deployment_track }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          APPROVED_SHA: ${{ steps.track.outputs.approved_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$EXPECTED_SHA" = "$APPROVED_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$ACTUAL_SHA" = "$APPROVED_SHA"
          if [ "$DEPLOYMENT_TRACK" = 'f17_qa' ]; then
            test "$(git rev-parse HEAD^{tree})" = 'b1bd80f431a62c7492acb33887022e0e1013c09f'
          elif [ "$DEPLOYMENT_TRACK" = 'f110_freeze' ]; then
            test "$(git rev-parse HEAD^{tree})" = 'e1381a7cd1d48059303d1593e7647a11a3b04fb3'
          fi
          echo "Authorized $DEPLOYMENT_TRACK SHA: $ACTUAL_SHA"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: gd, posix, fileinfo, pdo_sqlite, mbstring

      - name: Verify track and canonical versions
        shell: bash
        env:
          CORE_VERSION: ${{ steps.track.outputs.core_version }}
          SCHEMA_VERSION: ${{ steps.track.outputs.schema_version }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os, pathlib, re
          core=pathlib.Path('wordpress/plugins/badaround-core/badaround-core.php').read_text()
          installer=pathlib.Path('wordpress/plugins/badaround-core/includes/class-badaround-installer.php').read_text()
          report=pathlib.Path('wordpress/plugins/badaround-core/includes/class-badaround-report-schema.php').read_text()
          header=re.search(r'^ \* Version: ([^\s]+)$',core,re.M)
          constant=re.search(r"define\(\s*'BADAROUND_CORE_VERSION',\s*'([^']+)'\s*\)",core)
          schema=re.search(r"const SCHEMA_VERSION\s*=\s*'([^']+)'",installer)
          canonical=re.search(r"const VERSION\s*=\s*'([^']+)'",report)
          assert header and constant and header[1]==constant[1]==os.environ['CORE_VERSION'], 'Core version mismatch'
          assert schema and schema[1]==os.environ['SCHEMA_VERSION'], 'Schema version mismatch'
          assert canonical and canonical[1]=='badaround-report/v1', 'Canonical report version mismatch'
          PYTHON

      - name: Lint core plugin
        run: find ./wordpress/plugins/badaround-core -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Lint child theme
        run: find ./wordpress/themes/badaround-child -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Golden-state invariants
        shell: bash
        env:
          CORE_VERSION: ${{ steps.track.outputs.core_version }}
          SCHEMA_VERSION: ${{ steps.track.outputs.schema_version }}
        run: |
          set -euo pipefail
          grep -Fq "Version: $CORE_VERSION" ./wordpress/plugins/badaround-core/badaround-core.php
          grep -Fq "BADAROUND_CORE_VERSION', '$CORE_VERSION'" ./wordpress/plugins/badaround-core/badaround-core.php
          grep -Fq "SCHEMA_VERSION = '$SCHEMA_VERSION'" ./wordpress/plugins/badaround-core/includes/class-badaround-installer.php
          grep -q "BadAround_Contribution_Service" ./wordpress/plugins/badaround-core/includes/class-badaround-core.php
          grep -q "BadAround_Contribution_Moderation_Admin" ./wordpress/plugins/badaround-core/includes/class-badaround-core.php
          grep -q "BadAround_Sentinel_Service" ./wordpress/plugins/badaround-core/includes/class-badaround-core.php
          grep -q "BadAround_Sentinel_Matching_Service" ./wordpress/plugins/badaround-core/includes/class-badaround-core.php

      - name: Recovery invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq "'per_page'[[:space:]]*=>[[:space:]]*6" ./wordpress/themes/badaround-child/front-page.php
          grep -q "grid-template-columns:repeat(3,minmax(0,1fr))" ./wordpress/themes/badaround-child/assets/css/home.css
          grep -q 'data-ba-map-context="home"' ./wordpress/themes/badaround-child/front-page.php
          grep -q 'data-ba-map-context="detail"' ./wordpress/themes/badaround-child/template-parts/single-event-layout.php
          grep -q "BadAround_Contribution_Service::render_event_contribution_block" ./wordpress/themes/badaround-child/template-parts/single-event-layout.php
          grep -q "prepare_public_projection" ./wordpress/plugins/badaround-core/includes/class-badaround-publication-service.php
          grep -q "ensure_public_location" ./wordpress/plugins/badaround-core/includes/class-badaround-publication-service.php
          grep -q "approve_received_images_for_event" ./wordpress/plugins/badaround-core/includes/class-badaround-media-repository.php
          grep -q "Approva e pubblica" ./wordpress/plugins/badaround-core/includes/class-badaround-moderation-admin.php
          grep -Fq "array( 'prepare_public_projection' => true )" ./wordpress/plugins/badaround-core/includes/class-badaround-report-intake-service.php
          grep -q "public_projection_prepare_failed" ./wordpress/plugins/badaround-core/includes/class-badaround-report-persistence-service.php
          grep -q "progressiveFieldCandidates" ./wordpress/themes/badaround-child/assets/js/report.js
          grep -q "baUserTouched" ./wordpress/themes/badaround-child/assets/js/report.js
          grep -q "wpforms-6-field_17-container" ./wordpress/themes/badaround-child/assets/css/wpforms.css

      - name: D1
        run: php ./tests/sentinels-d1.php
      - name: D2
        run: php ./tests/sentinels-d2.php
      - name: D3
        run: php ./tests/sentinels-d3.php
      - name: E1
        run: php ./tests/contributions-e1.php
      - name: E2
        run: php ./tests/contributions-e2.php
      - name: E3
        run: php ./tests/contributions-e3.php
      - name: E4
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ba_contribution_notifications" ./wordpress/plugins/badaround-core/includes/class-badaround-installer.php
          grep -q "badaround_contribution_notify_reporter" ./wordpress/plugins/badaround-core/includes/class-badaround-contribution-moderation-service.php
          grep -q "BadAround_Transactional_Mailer" ./wordpress/plugins/badaround-core/includes/class-badaround-contribution-moderation-service.php
          grep -q "Testo riservato destinato al segnalatore" ./wordpress/plugins/badaround-core/includes/class-badaround-contribution-moderation-admin.php
      - name: E5
        run: php ./tests/contributions-e5.php

      - name: F1.7 reviewed media and fail-closed invariants
        if: inputs.deployment_track == 'f17_qa' || inputs.deployment_track == 'f110_freeze'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import pathlib
          core=pathlib.Path('wordpress/plugins/badaround-core')
          theme=pathlib.Path('wordpress/themes/badaround-child')
          checks={
            core/'badaround-core.php':['includes/class-badaround-native-media-service.php','includes/class-badaround-native-media-rest-controller.php'],
            core/'includes/class-badaround-core.php':['(new BadAround_Native_Media_REST_Controller())->register_hooks()','BadAround_Native_Media_Cleanup::register_hooks()'],
            core/'includes/class-badaround-native-media-rest-controller.php':['class BadAround_Native_Media_REST_Controller','/report-media-sessions','badaround-report-media/v1'],
            core/'includes/class-badaround-native-media-ledger.php':['ba_native_media_sessions','ba_native_media_items','ba_native_media_upload_keys','ba_native_media_limits','ba_native_media_operations'],
            core/'includes/class-badaround-installer.php':['BadAround_Native_Media_Ledger::schema_sql'],
            core/'includes/class-badaround-native-media-fence.php':['class BadAround_Native_Media_Fence'],
            core/'includes/class-badaround-publication-service.php':['BadAround_Native_Media_Fence::check'],
            core/'includes/class-badaround-media-repository.php':['BadAround_Native_Media_Fence::check'],
            theme/'assets/js/native-report/media.js':['class MediaTransport','class Media','X-BadAround-Media-Capability','badaround-report-media/v1'],
            theme/'assets/js/native-report/media-view.js':['ns.mountMedia','data-native-media'],
            theme/'assets/js/native-report/api.js':['X-BadAround-Media-Capability'],
            theme/'assets/js/native-report/wizard.js':['mediaView.media.freeze()','mediaView?.media.reportCapability()'],
            theme/'template-parts/native-report/step.php':['data-native-media','type="file"'],
          }
          for path,identifiers in checks.items():
            text=path.read_text()
            for identifier in identifiers:
              assert identifier in text, str(path)+': missing '+identifier
          PYTHON
          php <<'PHP'
          <?php
          define('ABSPATH', '/tmp/');
          require 'wordpress/plugins/badaround-core/includes/class-badaround-native-media-config.php';
          $config=new BadAround_Native_Media_Config(array());
          if ($config->enabled() || $config->get('enabled')!==false || $config->get('keys')!==array()
            || $config->get('active_key_id')!=='' || $config->get('temporary_budget')!==0
            || $config->get('archive_budget')!==0 || $config->get('hosting_verified')!==false) {
            fwrite(STDERR, "Media defaults are not fail-closed\n"); exit(1);
          }
          PHP

      - name: F1.7 canonical and no-media foundations
        if: inputs.deployment_track == 'f17_qa' || inputs.deployment_track == 'f110_freeze'
        shell: bash
        run: |
          set -euo pipefail
          for suite in f1 f12 f13 f14 f15 f16; do
            php "./tests/native-report-$suite.php"
          done

      - name: F1.10 municipality privacy regression
        if: inputs.deployment_track == 'f110_freeze'
        run: php ./tests/map-02r-priv-01.php

      - name: Fetch and verify exact frozen differential baseline
        if: inputs.deployment_track == 'f17_qa' || inputs.deployment_track == 'f110_freeze'
        shell: bash
        run: |
          set -euo pipefail
          FROZEN_SHA='bcc2c74ca3391f1d16f9b1eb9719650ea4d27952'
          FROZEN_FILE='wordpress/plugins/badaround-core/includes/class-badaround-native-report-rest-controller.php'
          git fetch --no-tags --depth=1 origin "$FROZEN_SHA"
          git cat-file -e "${FROZEN_SHA}^{commit}"
          FROZEN_HASH="$(git show "$FROZEN_SHA:$FROZEN_FILE" | sha256sum | awk '{print $1}')"
          test "$FROZEN_HASH" = '112d15d2db24896e88ed9c5de011734cf70aa1f74ad9267823744483d58dc085'
          if [ "${{ inputs.deployment_track }}" = 'f17_qa' ]; then
            test "$(git rev-parse HEAD)" = 'd6156e236d35da062c7f444bc73442e2905db54e'
          elif [ "${{ inputs.deployment_track }}" = 'f110_freeze' ]; then
            test "$(git rev-parse HEAD)" = '27be97f7468a9fe1ac41b4482e22e98307ac0c0a'
          fi

      - name: F1.7 backend media and security recovery
        if: inputs.deployment_track == 'f17_qa' || inputs.deployment_track == 'f110_freeze'
        shell: bash
        run: |
          set -euo pipefail
          php ./tests/native-media-f17b.php
          php ./tests/native-media-f17c.php
          php ./tests/native-media-no-media-differential.php
          python3 ./tests/native-media-http.py

      - name: Setup Node for F1.7 wizard tests
        if: inputs.deployment_track == 'f17_qa' || inputs.deployment_track == 'f110_freeze'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: F1.7 Step 5 integrated wizard JS DOM and HTTP tests
        if: inputs.deployment_track == 'f17_qa' || inputs.deployment_track == 'f110_freeze'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund
          npm test --prefix tests

      - name: Build release manifest
        shell: bash
        env:
          DEPLOYMENT_TRACK: ${{ inputs.deployment_track }}
          AUTHORIZED_REF: ${{ steps.track.outputs.ref }}
          CORE_VERSION: ${{ steps.track.outputs.core_version }}
          SCHEMA_VERSION: ${{ steps.track.outputs.schema_version }}
        run: |
          set -euo pipefail
          mkdir -p ./release-manifest
          SHA="$(git rev-parse HEAD)"
          CORE_TREE="$(find ./wordpress/plugins/badaround-core -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          THEME_TREE="$(find ./wordpress/themes/badaround-child -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          {
            echo "deployment_track=$DEPLOYMENT_TRACK"
            echo "ref=$AUTHORIZED_REF"
            echo "sha=$SHA"
            echo "core_version=$CORE_VERSION"
            echo "schema_version=$SCHEMA_VERSION"
            echo "core_tree_sha256=$CORE_TREE"
            echo "theme_tree_sha256=$THEME_TREE"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ./release-manifest/staging-release.txt

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: badaround-staging-release-manifest
          path: ./release-manifest/staging-release.txt
          if-no-files-found: error

  deploy:
    name: Deploy authorized core and theme track
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Independently resolve authorized track
        id: track
        shell: bash
        env:
          DEPLOYMENT_TRACK: ${{ inputs.deployment_track }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_TRACK" in
            release)
              REF='release/mvp-reconciled'
              APPROVED_SHA='27be97f7468a9fe1ac41b4482e22e98307ac0c0a'
              CORE_VERSION='0.18.0'
              SCHEMA_VERSION='1.9.0'
              ;;
            f17_qa)
              REF='recovery/native-media-f17-qa-rc'
              APPROVED_SHA='d6156e236d35da062c7f444bc73442e2905db54e'
              CORE_VERSION='0.18.0'
              SCHEMA_VERSION='1.9.0'
              ;;
            f110_freeze)
              REF='reconcile/f1-10-native-wizard-freeze'
              APPROVED_SHA='27be97f7468a9fe1ac41b4482e22e98307ac0c0a'
              CORE_VERSION='0.18.0'
              SCHEMA_VERSION='1.9.0'
              ;;
            *) echo 'Unauthorized deployment track' >&2; exit 1 ;;
          esac
          test "$EXPECTED_SHA" = "$APPROVED_SHA"
          {
            echo "ref=$REF"
            echo "approved_sha=$APPROVED_SHA"
            echo "core_version=$CORE_VERSION"
            echo "schema_version=$SCHEMA_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout authorized track
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.track.outputs.ref }}
          fetch-depth: 1

      - name: Re-verify approved track SHA before FTPS
        shell: bash
        env:
          DEPLOYMENT_TRACK: ${{ inputs.deployment_track }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          APPROVED_SHA: ${{ steps.track.outputs.approved_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$EXPECTED_SHA" = "$APPROVED_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$ACTUAL_SHA" = "$APPROVED_SHA"
          if [ "$DEPLOYMENT_TRACK" = 'f17_qa' ]; then
            test "$(git rev-parse HEAD^{tree})" = 'b1bd80f431a62c7492acb33887022e0e1013c09f'
          elif [ "$DEPLOYMENT_TRACK" = 'f110_freeze' ]; then
            test "$(git rev-parse HEAD^{tree})" = 'e1381a7cd1d48059303d1593e7647a11a3b04fb3'
          fi
          echo "Authorized $DEPLOYMENT_TRACK SHA: $ACTUAL_SHA"

      - name: Re-verify track and canonical versions before FTPS
        shell: bash
        env:
          CORE_VERSION: ${{ steps.track.outputs.core_version }}
          SCHEMA_VERSION: ${{ steps.track.outputs.schema_version }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os, pathlib, re
          core=pathlib.Path('wordpress/plugins/badaround-core/badaround-core.php').read_text()
          installer=pathlib.Path('wordpress/plugins/badaround-core/includes/class-badaround-installer.php').read_text()
          report=pathlib.Path('wordpress/plugins/badaround-core/includes/class-badaround-report-schema.php').read_text()
          header=re.search(r'^ \* Version: ([^\s]+)$',core,re.M)
          constant=re.search(r"define\(\s*'BADAROUND_CORE_VERSION',\s*'([^']+)'\s*\)",core)
          schema=re.search(r"const SCHEMA_VERSION\s*=\s*'([^']+)'",installer)
          canonical=re.search(r"const VERSION\s*=\s*'([^']+)'",report)
          assert header and constant and header[1]==constant[1]==os.environ['CORE_VERSION'], 'Core version mismatch'
          assert schema and schema[1]==os.environ['SCHEMA_VERSION'], 'Schema version mismatch'
          assert canonical and canonical[1]=='badaround-report/v1', 'Canonical report version mismatch'
          PYTHON

      - name: Upload core plugin over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./wordpress/plugins/badaround-core/
          server-dir: /staging.badaround.it/wp-content/plugins/badaround-core/
          dangerous-clean-slate: false
          log-level: minimal

      - name: Upload child theme over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./wordpress/themes/badaround-child/
          server-dir: /staging.badaround.it/wp-content/themes/badaround-child/
          dangerous-clean-slate: false
          log-level: minimal
