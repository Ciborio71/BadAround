name: Radar quality final offline review gate
on:
  push:
    branches:
      - feature/radar-quality-persistence-gated-20261031
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: |
          php -l wordpress/plugins/badaround-core/includes/class-badaround-radar-quality-registry.php
          php -l wordpress/plugins/badaround-core/includes/class-badaround-radar-territory-analysis.php
          php -l wordpress/plugins/badaround-core/includes/class-badaround-radar-editorial-decision.php
          php -l wordpress/plugins/badaround-core/includes/class-badaround-radar-review-store.php
          php tests/radar-quality-territory.php
          php tests/radar-quality-editorial-decision.php
          php tests/radar-review-store-gate.php
