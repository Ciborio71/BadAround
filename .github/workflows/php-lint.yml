name: PHP Syntax

on:
  pull_request:
    branches:
      - main
      - develop
      - release/mvp-reconciled
  push:
    branches:
      - "feature/**"
      - "release/mvp-rc1"
      - "release/mvp-reconciled"
      - "recovery/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: Lint plugin and child theme
    runs-on: ubuntu-latest

    services:
      media-db:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: f17b-synthetic-ci
          MARIADB_DATABASE: f17b
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: gd, posix, fileinfo, pdo_mysql, pdo_sqlite, mbstring
    
      - name: Lint BadAround core plugin
        run: find ./wordpress/plugins/badaround-core -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Lint BadAround child theme
        run: find ./wordpress/themes/badaround-child -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test recovery golden-state invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Version: 0.18.0" ./wordpress/plugins/badaround-core/badaround-core.php
          grep -q "SCHEMA_VERSION = '1.9.0'" ./wordpress/plugins/badaround-core/includes/class-badaround-installer.php
          grep -Eq "'per_page'[[:space:]]*=>[[:space:]]*6" ./wordpress/themes/badaround-child/front-page.php
          grep -q "grid-template-columns:repeat(3,minmax(0,1fr))" ./wordpress/themes/badaround-child/assets/css/home.css
          grep -q 'data-ba-map-context="home"' ./wordpress/themes/badaround-child/front-page.php
          grep -q 'data-ba-map-context="detail"' ./wordpress/themes/badaround-child/template-parts/single-event-layout.php
          grep -q "BadAround_Contribution_Service::render_event_contribution_block" ./wordpress/themes/badaround-child/template-parts/single-event-layout.php
          grep -q "prepare_public_projection" ./wordpress/plugins/badaround-core/includes/class-badaround-publication-service.php
          grep -q "approve_received_images_for_event" ./wordpress/plugins/badaround-core/includes/class-badaround-media-repository.php
          grep -q "progressiveFieldCandidates" ./wordpress/themes/badaround-child/assets/js/report.js

          grep -q "BADAROUND_CORE_VERSION', '0.18.0'" ./wordpress/plugins/badaround-core/badaround-core.php
          grep -q "BadAround_Contribution_Service" ./wordpress/plugins/badaround-core/includes/class-badaround-core.php
          grep -q "BadAround_Contribution_Moderation_Admin" ./wordpress/plugins/badaround-core/includes/class-badaround-core.php
          grep -q "BadAround_Sentinel_Service" ./wordpress/plugins/badaround-core/includes/class-badaround-core.php
          grep -q "BadAround_Sentinel_Matching_Service" ./wordpress/plugins/badaround-core/includes/class-badaround-core.php
          grep -q "ensure_public_location" ./wordpress/plugins/badaround-core/includes/class-badaround-publication-service.php
          grep -q "Approva e pubblica" ./wordpress/plugins/badaround-core/includes/class-badaround-moderation-admin.php
          grep -Fq "array( 'prepare_public_projection' => true )" ./wordpress/plugins/badaround-core/includes/class-badaround-report-intake-service.php
          grep -q "public_projection_prepare_failed" ./wordpress/plugins/badaround-core/includes/class-badaround-report-persistence-service.php
          grep -q "baUserTouched" ./wordpress/themes/badaround-child/assets/js/report.js
          grep -q "wpforms-6-field_17-container" ./wordpress/themes/badaround-child/assets/css/wpforms.css

      - name: Test F1 Native Report canonical foundation
        run: php ./tests/native-report-f1.php

      - name: Test F1.2 Canonical Report Contract
        run: php ./tests/native-report-f12.php

      - name: Test F1.3 Native Validation & Intake
        run: php ./tests/native-report-f13.php

      - name: Test F1.4 Native Persistence & Golden Path
        run: php ./tests/native-report-f14.php

      - name: Test F1.5 Public Native Intake Boundary
        run: php ./tests/native-report-f15.php

      - name: Test F1.6 Native Form server-rendered foundation
        run: php ./tests/native-report-f16.php

      - name: Test F1.7B native media backend and recovery with real MariaDB constraints
        env:
          BA_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=f17b
          BA_TEST_DB_USER: root
          BA_TEST_DB_PASSWORD: f17b-synthetic-ci
        run: php ./tests/native-media-f17b.php

      - name: Differential test against exact frozen F1.5 transport
        env:
          BA_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=f17b
          BA_TEST_DB_USER: root
          BA_TEST_DB_PASSWORD: f17b-synthetic-ci
        run: php ./tests/native-media-no-media-differential.php

      - name: Independent F1.7C security and recovery review with real MariaDB
        env:
          BA_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=f17b
          BA_TEST_DB_USER: root
          BA_TEST_DB_PASSWORD: f17b-synthetic-ci
        run: php ./tests/native-media-f17c.php

      - name: Test F1.7B real HTTP multipart on synthetic local fixtures
        run: python3 ./tests/native-media-http.py

      - name: Verify frozen backend and scoped F1.7D foundation extensions
        run: |
          git diff --exit-code beb33ec3325480f77a266b3b6356f5860b00e16e -- wordpress/plugins/badaround-core
          git diff --exit-code bcc2c74ca3391f1d16f9b1eb9719650ea4d27952 -- \
            wordpress/plugins/badaround-core/includes/class-badaround-report-schema.php \
            wordpress/plugins/badaround-core/includes/class-badaround-report-validator.php \
            wordpress/plugins/badaround-core/includes/class-badaround-report-normalizer.php \
            wordpress/plugins/badaround-core/includes/class-badaround-native-report-intake-service.php \
            wordpress/plugins/badaround-core/includes/class-badaround-native-report-golden-path-service.php \
            wordpress/plugins/badaround-core/includes/class-badaround-report-persistence-service.php \
            wordpress/plugins/badaround-core/includes/class-badaround-wpforms-event-intake.php \
            wordpress/themes/badaround-child/assets/js/native-report/model.js \
            wordpress/themes/badaround-child/template-parts/native-report/shell.php \
            wordpress/themes/badaround-child/page-segnala-evento.php \
            wordpress/themes/badaround-child/assets/css/report.css \
            wordpress/themes/badaround-child/assets/js/report.js
          python3 - <<'PY'
          import pathlib, subprocess
          theme='wordpress/themes/badaround-child/'
          allowed={'assets/css/native-report.css','assets/js/native-report/api.js','assets/js/native-report/errors.js','assets/js/native-report/media.js','assets/js/native-report/media-view.js','assets/js/native-report/wizard.js','functions.php','inc/native-report.php','template-parts/native-report/step.php'}
          changed=subprocess.check_output(['git','diff','--name-only','beb33ec3325480f77a266b3b6356f5860b00e16e','--',theme],text=True).splitlines()
          assert all(p.removeprefix(theme) in allowed for p in changed), changed
          css=theme+'assets/css/native-report.css'
          frozen=subprocess.check_output(['git','show','beb33ec3325480f77a266b3b6356f5860b00e16e:'+css],text=True)
          assert pathlib.Path(css).read_text().startswith(frozen), 'F1.6 base CSS changed'
          PY

      - name: Setup Node for native form tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Test F1.6 foundation and F1.7D media model DOM and real HTTP integration
        run: |
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund
          npm test --prefix tests

      - name: Test D1 Sentinel lifecycle
        run: php ./tests/sentinels-d1.php

      - name: Test D2 Sentinel matching
        run: php ./tests/sentinels-d2.php

      - name: Test D3 Sentinel completion
        run: php ./tests/sentinels-d3.php

      - name: Test E1 Contribution Core
        run: php ./tests/contributions-e1.php

      - name: Test E2 Contribution Moderation
        run: php ./tests/contributions-e2.php

      - name: Test E3 Contribution Media
        run: |
          cp ./tests/contributions-e3.php ./tests/contributions-e3-ci.php
          sed -i "s/1\\\\.6\\\\.0/1\\\\.7\\\\.0/" ./tests/contributions-e3-ci.php
          php ./tests/contributions-e3-ci.php
          rm ./tests/contributions-e3-ci.php

      - name: Test E4 Reporter Notification
        run: |
          grep -q "SCHEMA_VERSION = '1.9.0'" ./wordpress/plugins/badaround-core/includes/class-badaround-installer.php
          grep -q "ba_contribution_notifications" ./wordpress/plugins/badaround-core/includes/class-badaround-installer.php
          grep -q "recipient_text longtext" ./wordpress/plugins/badaround-core/includes/class-badaround-installer.php
          grep -q "badaround_contribution_notify_reporter" ./wordpress/plugins/badaround-core/includes/class-badaround-contribution-moderation-service.php
          grep -q "BadAround_Transactional_Mailer" ./wordpress/plugins/badaround-core/includes/class-badaround-contribution-moderation-service.php
          grep -q "Per motivi di privacy il contenuto non è incluso in questa email" ./wordpress/plugins/badaround-core/includes/class-badaround-contribution-moderation-service.php
          grep -q "2 \* DAY_IN_SECONDS" ./wordpress/plugins/badaround-core/includes/class-badaround-contribution-moderation-service.php
          grep -q "X-Robots-Tag: noindex, nofollow, noarchive" ./wordpress/plugins/badaround-core/includes/class-badaround-contribution-moderation-service.php
          grep -q "Testo riservato destinato al segnalatore" ./wordpress/plugins/badaround-core/includes/class-badaround-contribution-moderation-admin.php

      - name: Test E5 B4 Integration
        run: php ./tests/contributions-e5.php
