name: BadAround Home 2 preview guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - tools/ba_home_two_release.py
      - .github/workflows/ba-home-two.yml
permissions:
  contents: read
concurrency:
  group: ba-home-two-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[home-two-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: b2ca63d355f3707c72b1d217357bbfe61b232f85
          path: prior-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify isolated preview and existing contribution regressions
        run: |
          npm ci --prefix tests --ignore-scripts
          php -l wordpress/themes/badaround-child/functions.php
          php -l wordpress/themes/badaround-child/inc/home-two.php
          php -l wordpress/themes/badaround-child/page-home-2.php
          php tests/home-two-render.php
          php tests/maintenance-contributions.php
          php tests/contributions-e2.php
          php tests/contributions-e5.php
          node --check wordpress/themes/badaround-child/assets/js/home-two.js
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
      - name: Verify responsive preview and search
        run: |
          npm install --no-save --prefix tests playwright-core
          python3 -m http.server 8765 > /tmp/home-two-server.log 2>&1 &
          node tests/home-two-browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: home-two-rendered-preview
          path: |
            home-two-desktop.png
            home-two-mobile.png
          retention-days: 7
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install Home 2 preview UX
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_home_two_release.py

# Preview fixture: explicit WordPress query helper.

