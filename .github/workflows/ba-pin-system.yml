name: BadAround unified category pin system guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - tools/ba_pin_system_release.py
      - .github/workflows/ba-pin-system.yml
permissions:
  contents: read
concurrency:
  group: ba-pin-system-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[pin-system-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: df83c3c2e6871c4d33bb245634e1ef436f0a7c80
          path: prior-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify unified category pin system and access regressions
        run: |
          npm ci --prefix tests --ignore-scripts
          find wordpress/themes/badaround-child -name "*.php" -exec php -l {} \; > /dev/null
          php tests/pin-system.php
          php tests/native-report-f16.php
          php tests/nf-ux-02b-v2.php
          php tests/event-gallery.php
          php tests/event-publication-policy.php
          node --test tests/geo-public-06-rendering.cjs tests/perf-polish-01-map-loading.cjs tests/home-lighthouse-assets.cjs tests/native-report-f16-dom.cjs tests/native-report-f19-ux.cjs tests/geo-area-01-model.cjs tests/home-proximity.cjs
          npm install --no-save --prefix tests playwright-core
          BA_CHROMIUM=/usr/bin/google-chrome node tests/pin-system-browser.cjs
          python3 -m py_compile tools/ba_pin_system_release.py
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install unified category pin system rendering
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_pin_system_release.py
