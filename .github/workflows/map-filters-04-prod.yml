name: MAP-FILTERS-04 production deploy
on:
  push:
    branches: [feature/maintenance-01]
    paths: ['ops/map-filters-04-launch.txt']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          php -l wordpress/themes/badaround-child/page-mappa.php
          node --check wordpress/themes/badaround-child/assets/js/map.js
      - name: Deploy MAP-FILTERS-04 files
        run: |
          python - <<'PY'
          import ftplib,ssl,os,hashlib,io
          files=[
            ('wordpress/themes/badaround-child/page-mappa.php','/httpdocs/wp-content/themes/badaround-child/page-mappa.php'),
            ('wordpress/themes/badaround-child/assets/css/map.css','/httpdocs/wp-content/themes/badaround-child/assets/css/map.css'),
            ('wordpress/themes/badaround-child/assets/js/map.js','/httpdocs/wp-content/themes/badaround-child/assets/js/map.js'),
          ]
          f=ftplib.FTP_TLS(context=ssl._create_unverified_context(),timeout=60)
          f.connect(os.environ['FTP_HOST'],21); f.login(os.environ['FTP_USER'],os.environ['FTP_PASS']); f.prot_p()
          for local,remote in files:
            backup=remote+'.mapfilters04.bak'
            old=io.BytesIO(); f.retrbinary('RETR '+remote,old.write)
            try:f.delete(backup)
            except:pass
            old.seek(0); f.storbinary('STOR '+backup,old)
            with open(local,'rb') as fh:f.storbinary('STOR '+remote,fh)
            new=io.BytesIO(); f.retrbinary('RETR '+remote,new.write)
            lsha=hashlib.sha256(open(local,'rb').read()).hexdigest()
            rsha=hashlib.sha256(new.getvalue()).hexdigest()
            print(local,lsha,rsha); assert lsha==rsha
          f.quit()
          PY
