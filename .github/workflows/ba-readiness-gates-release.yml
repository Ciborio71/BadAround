name: BA Identity private readiness gates targeted release
on:
  push:
    branches:
      - reconcile/identity-production-baseline-20261104
    paths:
      - .github/workflows/ba-readiness-gates-release.yml
permissions:
  contents: read
concurrency:
  group: badaround-targeted-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: "github.event.head_commit.message == 'release: apply audited Identity readiness gates'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f58979aab6fdb68a84d5a950ae75828448258da6
          path: baseline
          persist-credentials: false
      - name: Verify source and pinned previous revision
        run: |
          set -euo pipefail
          cp baseline/wordpress/plugins/badaround-core/identity-dormant/wordpress-qa-readiness.php _ba_previous_qa_readiness.php
          python3 -m py_compile tools/ba_readiness_allowlist_guarded_release.py
          php -l wordpress/plugins/badaround-core/identity-dormant/wordpress-qa-readiness.php
      - name: Validate remote source bytes read only
        env:
          FTP_HOST: '46.231.24.137'
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          BA_QA_READINESS_MODE: preflight
        run: python3 tools/ba_readiness_allowlist_guarded_release.py
      - name: Update only dormant readiness PHP with rollback
        env:
          FTP_HOST: '46.231.24.137'
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          BA_QA_READINESS_MODE: deploy
        run: python3 tools/ba_readiness_allowlist_guarded_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ba-readiness-gates-evidence
          path: ba-readiness-release-evidence.json
          retention-days: 7
          if-no-files-found: ignore
