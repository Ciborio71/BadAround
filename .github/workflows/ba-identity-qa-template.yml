name: BadAround Identity QA page template
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - wordpress/themes/badaround-child/page-identity-qa.php
      - wordpress/themes/badaround-child/assets/css/identity-qa.css
      - tools/ba_identity_qa_template_release.py
      - .github/workflows/ba-identity-qa-template.yml
permissions:
  contents: read
concurrency:
  group: badaround-identity-qa-template
  cancel-in-progress: false
jobs:
  template-release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated presentation files
        run: |
          php -l wordpress/themes/badaround-child/page-identity-qa.php
          python3 -m py_compile tools/ba_identity_qa_template_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install only the dedicated template and its stylesheet
        env:
          FTP_HOST: "46.231.24.137"
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_identity_qa_template_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: badaround-identity-qa-template
          path: identity-qa-template-evidence.json
          if-no-files-found: error
          retention-days: 14
