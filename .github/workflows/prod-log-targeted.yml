name: PROD-DIAG-03 targeted 503 log analysis
on:
  push:
    branches: [release/production-mvp-01]
    paths: ['ops/prod-log-targeted-launch.txt']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
    steps:
      - name: Download recent relevant logs
        run: |
          mkdir -p logs
          python - <<'PY'
          import ftplib,ssl,os,io,pathlib,json,re
          f=ftplib.FTP_TLS(context=ssl._create_unverified_context(),timeout=60)
          f.connect(os.environ['FTP_HOST'],21);f.login(os.environ['FTP_USER'],os.environ['FTP_PASS']);f.prot_p()
          selected=[]
          for name,facts in f.mlsd('/logs'):
            if name in ('.','..') or facts.get('type')!='file': continue
            size=int(facts.get('size','0') or 0)
            mod=facts.get('modify','')
            low=name.lower()
            if size<=50_000_000 and (mod.startswith('20261024') or any(k in low for k in ['error','php','proxy'])):
              safe=re.sub(r'[^A-Za-z0-9._-]','_',name)
              try:
                b=io.BytesIO();f.retrbinary('RETR /logs/'+name,b.write)
                pathlib.Path('logs/'+safe).write_bytes(b.getvalue())
                selected.append({'remote':name,'local':safe,'size':size,'modify':mod})
              except Exception as e:
                selected.append({'remote':name,'error':str(e)})
          f.quit()
          pathlib.Path('logs/index.json').write_text(json.dumps(selected,indent=2))
          print(json.dumps(selected))
          PY
      - name: Extract textual diagnostics around cutover
        run: |
          set +e
          echo '=== LOG FILE TYPES ==='
          file logs/* || true
          echo '=== TARGETED MATCHES ==='
          for f in logs/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.gz)
                gzip -cd "$f" 2>/dev/null | grep -Eai -C 3 '17:4[12]|PHP Fatal|Uncaught|proxy_fcgi|AH[0-9]+|503|Premature end|Primary script unknown' | tail -n 250
                ;;
              *.zip)
                ;;
              *)
                strings "$f" | grep -Eai -C 3 '17:4[12]|PHP Fatal|Uncaught|proxy_fcgi|AH[0-9]+|503|Premature end|Primary script unknown' | tail -n 250
                ;;
            esac
          done
