name: RADAR-GMAP-02 targeted production deploy
on:
  push:
    branches: [release/production-mvp-01]
    paths:
      - 'ops/radar-gmap-02-deploy-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: badaround-targeted-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
      EXPECTED_PARENT: 2c26af93e040c21c1bdc2d9142533981c9e56a79
      EXPECTED_HEAD: 4bad6aeac9412971acb477562941b033861811dc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install TLS trust bundle
        run: |
          set -euo pipefail
          mkdir -p tls evidence
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/curl-chain.pem
      - name: Targeted one-file guarded deploy
        run: |
          python ops/radar-gmap-02-deploy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-gmap-02-deployment-evidence
          path: evidence/
          retention-days: 30
