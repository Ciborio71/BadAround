name: INTELLIGENCE-01P temporary probe
on:
  push:
    branches: [release/production-mvp-01]
    paths:
      - 'ops/intelligence-01p-probe-install-trigger.txt'
      - 'ops/intelligence-01p-probe-remove-trigger.txt'
permissions:
  contents: read
concurrency:
  group: badaround-targeted-production-deploy
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
    steps:
      - uses: actions/checkout@v4
      - run: php -l ops/intelligence-01p-runtime-probe.php
      - name: TLS trust
        run: |
          set -euo pipefail
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/curl-chain.pem
      - name: Install or remove temporary probe
        env:
          PROBE_MODE: ${{ contains(github.event.head_commit.message, '[probe-remove]') && 'remove' || 'install' }}
        run: python3 ops/intelligence-01p-probe-deploy.py
