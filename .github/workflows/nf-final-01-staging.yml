name: NF-FINAL-01 — Authorized staging deploy
on:
  push:
    branches:
      - deploy/nf-final-01-staging
permissions:
  contents: read
concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify authorized application and workflow-only delta
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '5b03f0728d8f1065b86725fb90ab59d94ea73803'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/nf-final-01-staging.yml'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Native PHP and JS syntax
        run: |
          set -euo pipefail
          find wordpress/plugins/badaround-core wordpress/themes/badaround-child -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          for p in model wizard api smart-address media media-view errors; do
            node --check "wordpress/themes/badaround-child/assets/js/native-report/$p.js"
          done
      - name: Native Form end-to-end synthetic UX, privacy, smart address and media DOM
        run: |
          set -euo pipefail
          npm ci --prefix tests
          node --test \
            tests/native-report-f16.cjs \
            tests/native-report-f16-dom.cjs \
            tests/native-report-f19-ux.cjs \
            tests/nf-final-01-ux.cjs \
            tests/f1-15b-r5-smart-address.cjs \
            tests/sf8-national-territory.cjs \
            tests/sf9-public-privacy-boundary.cjs \
            tests/native-media-f17d-dom.cjs \
            tests/native-media-f17d-extra.cjs
      - name: Native backend, publication, territory, and media synthetic constraints
        run: |
          set -euo pipefail
          for file in \
            tests/native-report-f13.php \
            tests/native-report-f14.php \
            tests/native-report-f15.php \
            tests/f1-15a3-territory.php \
            tests/f1-14r-publication-contract.php \
            tests/f1-14r-consumers.php \
            tests/map-02r-priv-01.php
          do php "$file" >/dev/null; done
      - name: Local browser smoke (all requests intercepted, no WordPress writes)
        run: |
          npm install --prefix /tmp/nf-browser-runner --no-save playwright@1.62.1
          node /tmp/nf-browser-runner/node_modules/playwright/cli.js install --with-deps chromium
          BA_PLAYWRIGHT_MODULE=/tmp/nf-browser-runner/node_modules/playwright node tests/nf-final-01-browser.cjs
      - name: Protect frozen backend and data contracts
        run: |
          set -euo pipefail
          git diff --check 9a94937 HEAD
          test -z "$(git diff --name-only 9a94937 HEAD -- wordpress/plugins tests/fixtures)"
  deploy:
    needs: native
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare only seven authorized files and verified baseline rollback
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/deploy/nf-final-01-staging'
          test "$(git rev-parse HEAD^)" = '5b03f0728d8f1065b86725fb90ab59d94ea73803'
          for path in assets/css/native-report.css assets/js/native-report/errors.js assets/js/native-report/smart-address.js assets/js/native-report/wizard.js inc/native-report.php template-parts/native-report/shell.php template-parts/native-report/step.php; do
            mkdir -p "nf-new/$(dirname "$path")" "nf-rollback/$(dirname "$path")"
            cp "wordpress/themes/badaround-child/$path" "nf-new/$path"
            git show "9a949373bfe5c1fa892d449b90afa576e264a701:wordpress/themes/badaround-child/$path" > "nf-rollback/$path"
          done
          test "$(find nf-new -type f | wc -l)" -eq 7
          test "$(find nf-rollback -type f | wc -l)" -eq 7
          find nf-new nf-rollback -type f -exec sha256sum {} + > nf-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nf-final-01-predeploy-rollback
          path: |
            nf-rollback/
            nf-manifest.txt
          retention-days: 14
          if-no-files-found: error
      - name: Upload seven Native UI files to staging only
        id: upload
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./nf-new/
          server-dir: /staging.badaround.it/wp-content/themes/badaround-child/
          dangerous-clean-slate: false
          state-name: .nf-final-01-state.json
          log-level: minimal
      - name: Restore verified baseline if upload fails
        if: steps.upload.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./nf-rollback/
          server-dir: /staging.badaround.it/wp-content/themes/badaround-child/
          dangerous-clean-slate: false
          state-name: .nf-final-01-rollback-state.json
          log-level: minimal
      - name: Confirm upload outcome
        run: test '${{ steps.upload.outcome }}' = success
      - name: Non-mutating HTML and public asset verification
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 45 "https://staging.badaround.it/segnala-un-evento/?nf-final-01=$GITHUB_SHA" -o /tmp/nf-page.html
          grep -q 'data-native-position' /tmp/nf-page.html
          grep -q '"locationManualEntry":false' /tmp/nf-page.html
          for path in assets/css/native-report.css assets/js/native-report/errors.js assets/js/native-report/smart-address.js assets/js/native-report/wizard.js; do
            curl --fail --silent --show-error --max-time 45 "https://staging.badaround.it/wp-content/themes/badaround-child/$path?nf-final-01=$GITHUB_SHA" -o /tmp/nf-asset
            cmp "nf-new/$path" /tmp/nf-asset
          done
