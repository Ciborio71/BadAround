name: BadAround alert color and light favicon guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - tools/ba_alert_favicon_release.py
      - .github/workflows/ba-alert-favicon.yml
permissions:
  contents: read
concurrency:
  group: ba-alert-favicon-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[alert-favicon-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: f85f144ca1864a158008f59444a6981ccfc2d1c8
          path: prior-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify alert color and light favicon and access regressions
        run: |
          npm ci --prefix tests --ignore-scripts
          php -l wordpress/themes/badaround-child/functions.php
          npm install --no-save --prefix tests playwright-core
          BA_CHROMIUM=/usr/bin/google-chrome node tests/event-interaction-browser.cjs
          python3 -m py_compile tools/ba_alert_favicon_release.py
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install alert color and light favicon rendering
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_alert_favicon_release.py
