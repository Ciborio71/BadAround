name: BA-IDENTITY-01C isolated primitive tests
on:
  push:
    branches:
      - feature/ba-identity-01c-dormant-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-primitives:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PHP 8.3 with required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_mysql, pcntl
          coverage: none
      - name: PHP syntax
        run: |
          php -l prototypes/ba-identity-01c/challenge-primitives.php
          php -l prototypes/ba-identity-01c/test-challenge-primitives.php
          php -l prototypes/ba-identity-01c/challenge-store.php
          php -l prototypes/ba-identity-01c/test-challenge-store.php
          php -l prototypes/ba-identity-01c/ownership-policy.php
          php -l prototypes/ba-identity-01c/test-ownership-policy.php
          php -l prototypes/ba-identity-01c/mysql-challenge-store.php
          php -l prototypes/ba-identity-01c/session-policy.php
          php -l prototypes/ba-identity-01c/test-session-policy.php
          php -l prototypes/ba-identity-01c/mysql-session-store.php
          php -l prototypes/ba-identity-01c/csrf-policy.php
          php -l prototypes/ba-identity-01c/test-csrf-policy.php
          php -l prototypes/ba-identity-01c/test-mysql-integration.php
          php -l prototypes/ba-identity-01c/test-mysql-concurrency.php
          php -l prototypes/ba-identity-01c/identity-active-status.php
          php -l prototypes/ba-identity-01c/mysql-identity-active-status.php
          php -l prototypes/ba-identity-01c/test-mysql-active-status.php
          php -l prototypes/ba-identity-01c/edit-guard.php
          php -l prototypes/ba-identity-01c/test-edit-guard.php
          php -l prototypes/ba-identity-01c/verification-coordinator.php
          php -l prototypes/ba-identity-01c/test-verification-coordinator.php
          php -l prototypes/ba-identity-01c/enrollment-policy.php
          php -l prototypes/ba-identity-01c/test-enrollment-policy.php
          php -l prototypes/ba-identity-01c/mysql-enrollment-store.php
          php -l prototypes/ba-identity-01c/test-mysql-enrollment.php
          php -l prototypes/ba-identity-01c/test-mysql-enrollment-race.php
          php -l prototypes/ba-identity-01c/mysql-ownership-store.php
          php -l prototypes/ba-identity-01c/test-mysql-ownership.php
          php -l prototypes/ba-identity-01c/mysql-rate-limiter.php
          php -l prototypes/ba-identity-01c/test-mysql-rate-limiter.php
          php -l prototypes/ba-identity-01c/post-intake-binder.php
          php -l prototypes/ba-identity-01c/test-post-intake-binder.php
          php -l prototypes/ba-identity-01c/community-policy.php
          php -l prototypes/ba-identity-01c/test-community-policy.php
          php -l prototypes/ba-identity-01c/purpose-keys.php
          php -l prototypes/ba-identity-01c/test-purpose-keys.php
          php -l prototypes/ba-identity-01c/otp-issuer.php
          php -l prototypes/ba-identity-01c/test-otp-issuer.php
          php -l prototypes/ba-identity-01c/otp-adapters.php
          php -l prototypes/ba-identity-01c/test-otp-adapters.php
          php -l prototypes/ba-identity-01c/ownership-recovery-policy.php
          php -l prototypes/ba-identity-01c/test-ownership-recovery-policy.php
          php -l prototypes/ba-identity-01c/revision-request-policy.php
          php -l prototypes/ba-identity-01c/test-revision-request-policy.php
          php -l prototypes/ba-identity-01c/comment-moderation-policy.php
          php -l prototypes/ba-identity-01c/test-comment-moderation-policy.php
          php -l prototypes/ba-identity-01c/mysql-ownership-recovery-store.php
          php -l prototypes/ba-identity-01c/test-mysql-ownership-recovery.php
      - name: OTP state machine tests
        run: |
          php prototypes/ba-identity-01c/test-challenge-primitives.php
          php prototypes/ba-identity-01c/test-challenge-store.php
          php prototypes/ba-identity-01c/test-ownership-policy.php
          php prototypes/ba-identity-01c/test-session-policy.php
          php prototypes/ba-identity-01c/test-csrf-policy.php
          php prototypes/ba-identity-01c/test-edit-guard.php
          php prototypes/ba-identity-01c/test-verification-coordinator.php
          php prototypes/ba-identity-01c/test-enrollment-policy.php
          php prototypes/ba-identity-01c/test-post-intake-binder.php
          php prototypes/ba-identity-01c/test-community-policy.php
          php prototypes/ba-identity-01c/test-purpose-keys.php
          php prototypes/ba-identity-01c/test-otp-issuer.php
          php prototypes/ba-identity-01c/test-otp-adapters.php
          php prototypes/ba-identity-01c/test-ownership-recovery-policy.php
          php prototypes/ba-identity-01c/test-revision-request-policy.php
          php prototypes/ba-identity-01c/test-comment-moderation-policy.php

  identity-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ba_identity_ci
          MYSQL_USER: ba_ci
          MYSQL_PASSWORD: local-ci-only-password
          MYSQL_ROOT_PASSWORD: local-ci-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal-ci-root-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PHP 8.3 with MySQL support
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_mysql, pcntl
          coverage: none
      - name: Ephemeral MySQL integration
        env:
          BA_TEST_DB_DSN: "mysql:host=127.0.0.1;port=3306;dbname=ba_identity_ci;charset=utf8mb4"
          BA_TEST_DB_USER: ba_ci
          BA_TEST_DB_PASS: local-ci-only-password
        run: |
          php -r 'foreach (["mbstring", "openssl", "pdo_mysql", "pcntl"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "Missing ".$e.PHP_EOL); exit(1); } }'
          php prototypes/ba-identity-01c/test-mysql-integration.php
          php prototypes/ba-identity-01c/test-mysql-concurrency.php
          php prototypes/ba-identity-01c/test-mysql-enrollment.php
          php prototypes/ba-identity-01c/test-mysql-enrollment-race.php
          php prototypes/ba-identity-01c/test-mysql-ownership.php
          php prototypes/ba-identity-01c/test-mysql-rate-limiter.php
          php prototypes/ba-identity-01c/test-mysql-active-status.php
          php prototypes/ba-identity-01c/test-mysql-ownership-recovery.php
