name: BadAround navbar session guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - tools/ba_navbar_session_release.py
      - .github/workflows/ba-navbar-session.yml
permissions:
  contents: read
concurrency:
  group: ba-navbar-session-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[navbar-session-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 9688529aa1b5cb69afe0c09c4686098f2ef831af
          path: prior-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify navbar session and access regressions
        run: |
          npm ci --prefix tests --ignore-scripts
          php -l wordpress/themes/badaround-child/header.php
          php -l wordpress/plugins/badaround-core/identity-dormant/wordpress-private-bootstrap.php
          php -l wordpress/plugins/badaround-core/identity-dormant/wordpress-identity-portal.php
          php -l wordpress/plugins/badaround-core/identity-dormant/wordpress-session-rest.php
          php tests/test-ba-access-portal.php
          php tests/test-ba-navbar-session.php
          node --test tests/test-ba-access-ui.cjs
          python3 -m py_compile tools/ba_navbar_session_release.py
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install navbar session rendering
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_navbar_session_release.py
