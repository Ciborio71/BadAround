name: BadAround fresh backup presence check
on:
  push:
    branches:
      - reconcile/identity-production-baseline-20261104
    paths:
      - .github/workflows/ba-fresh-backup-check.yml
permissions:
  contents: read
jobs:
  verify:
    if: "github.event.head_commit.message == 'audit: verify user completed current production backup'"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only production backup inventory
        env:
          FTP_HOST: '46.231.24.137'
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
        run: python3 tools/ba_production_backup_readonly_preflight.py
      - name: Save metadata only
        uses: actions/upload-artifact@v4
        with:
          name: ba-fresh-backup-presence
          path: ba-production-backup-preflight.json
          retention-days: 3

# One-shot read-only check following user backup confirmation.
