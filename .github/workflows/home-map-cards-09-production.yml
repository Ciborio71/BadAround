name: HOME-MAP-CARDS-09 targeted production deploy
on:
  push:
    branches: [release/production-mvp-01]
    paths:
      - 'ops/home-map-cards-09-deploy-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: badaround-targeted-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
      EXPECTED_PARENT: 85129f7189e455c0c2c775a97fee4108d195bb92
      EXPECTED_HEAD: 2154378d44ace9a8b1bf1382df6dcb2fb5afef40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install TLS trust bundle
        run: |
          set -euo pipefail
          mkdir -p tls evidence
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/curl-chain.pem
      - name: Guarded three-file Home UX deploy
        run: |
          python ops/home-map-cards-09-deploy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-map-cards-09-deployment-evidence
          path: evidence/
          retention-days: 30
