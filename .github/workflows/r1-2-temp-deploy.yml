name: R1.2 temporary staging deploy

on:
  push:
    branches:
      - feature/r1-2-home-cleanup

permissions:
  contents: read

concurrency:
  group: badaround-staging-theme
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy BadAround child theme R1.2
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload child theme over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./wordpress/themes/badaround-child/
          server-dir: /staging.badaround.it/wp-content/themes/badaround-child/
          dangerous-clean-slate: false
          log-level: minimal
