name: BA-IDENTITY 02E private account activity custody
on:
  push:
    branches:
      - feature/ba-identity-01c-dormant-20261103
    paths:
      - .github/workflows/ba-identity-02e-activity-custody.yml
permissions:
  contents: read
concurrency:
  group: badaround-production-scoped-ftps
  cancel-in-progress: false
jobs:
  activity-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare PHP and Node
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_mysql
          coverage: none
      - name: Verify isolated portal and custody safety
        run: |
          python3 -m py_compile .github/scripts/ba_identity_02e_activity_custody.py
          php prototypes/ba-identity-01c/test-wordpress-identity-portal.php
          php prototypes/ba-identity-01c/test-wordpress-private-bootstrap.php
          node --check prototypes/ba-identity-01c/identity-portal.js
      - name: Guarded dormant own-activity patch
        env:
          FTP_HOST: "46.231.24.137"
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
        run: python3 .github/scripts/ba_identity_02e_activity_custody.py
