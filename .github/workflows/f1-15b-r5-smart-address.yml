name: F1.15B-R5 Smart Address Isolated QA
on:
  push:
    branches:
      - feature/f1-15b-r5-smart-address-native
      - feature/leg-retire-01-native-only
  pull_request:
    branches:
      - feature/f1.15a3-canonical-territory-path
      - feature/f1-15b-r5-smart-address-native
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smart-address:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax on presentation surface
        run: |
          php -l wordpress/plugins/badaround-core/badaround-core.php
          php -l wordpress/plugins/badaround-core/includes/class-badaround-core.php
          php -l wordpress/themes/badaround-child/page-segnala-evento.php
          php -l wordpress/themes/badaround-child/functions.php
          php -l wordpress/themes/badaround-child/inc/native-report.php
          php -l wordpress/themes/badaround-child/template-parts/native-report/step.php
      - name: Node syntax
        run: |
          node --check wordpress/themes/badaround-child/assets/js/native-report/smart-address.js
          node --check wordpress/themes/badaround-child/assets/js/native-report/wizard.js
      - name: Install DOM harness dependencies
        run: npm ci --prefix tests
      - name: Smart Address isolated regressions
        run: node --test tests/f1-15b-r5-smart-address.cjs
      - name: Existing native wizard DOM regressions
        run: node --test tests/native-report-f16-dom.cjs
      - name: Frozen contract and disallowed consumer guard
        run: |
          git diff --exit-code 25b9ff5ad9d747b10cef7c2f3981fab15fbe4ed3 -- wordpress/plugins/badaround-core/includes/class-badaround-report-schema.php wordpress/plugins/badaround-core/includes/class-badaround-publication-service.php wordpress/plugins/badaround-core/includes/class-badaround-discovery-contract.php wordpress/plugins/badaround-core/includes/class-badaround-discovery-query.php wordpress/plugins/badaround-core/includes/class-badaround-native-media-service.php
      - name: Legacy retirement static contract
        run: node --test tests/leg-retire-01-native-only.cjs
      - name: Territory resolver regression
        run: php tests/f1-15a3-territory.php
