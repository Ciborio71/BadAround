name: RADAR-01C synthetic foundation tests
on:
  push:
    branches: [feature/radar-01c-foundation]
    paths:
      - 'ops/radar-01c/**'
      - '.github/workflows/radar-01c-tests.yml'
permissions:
  contents: read
jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP CLI
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
      - name: PHP syntax
        run: php -l ops/radar-01c/radar-prototype.php && php -l ops/radar-01c/radar-prototype-test.php && php -l ops/radar-01c/radar-privacy-gate.php && php -l ops/radar-01c/radar-privacy-gate-test.php && php -l ops/radar-01c/radar-public-area-adapter.php && php -l ops/radar-01c/radar-public-area-adapter-test.php && php -l ops/radar-01c/radar-area-registry.php && php -l ops/radar-01c/radar-area-registry-test.php && php -l ops/radar-01c/intelligence-aggregator.php && php -l ops/radar-01c/intelligence-aggregator-test.php && php -l ops/radar-01c/intelligence-projection-adapter.php && php -l ops/radar-01c/intelligence-projection-adapter-test.php && php -l ops/radar-01c/intelligence-spike-screener.php && php -l ops/radar-01c/intelligence-spike-screener-test.php && php -l ops/radar-01c/intelligence-pipeline.php && php -l ops/radar-01c/intelligence-pipeline-test.php && php -l ops/radar-01c/intelligence-discovery-preflight.php && php -l ops/radar-01c/intelligence-discovery-preflight-test.php && php -l ops/radar-01c/intelligence-public-report-summary.php && php -l ops/radar-01c/intelligence-public-report-summary-test.php && php -l ops/radar-01c/intelligence-discovery-snapshot.php && php -l ops/radar-01c/intelligence-discovery-snapshot-test.php && php -l ops/radar-01c/intelligence-report-read-model.php && php -l ops/radar-01c/intelligence-report-read-model-test.php
      - name: Synthetic fixture assertions
        run: php ops/radar-01c/radar-prototype-test.php && php ops/radar-01c/radar-privacy-gate-test.php && php ops/radar-01c/radar-public-area-adapter-test.php && php ops/radar-01c/radar-area-registry-test.php && php ops/radar-01c/intelligence-aggregator-test.php && php ops/radar-01c/intelligence-projection-adapter-test.php && php ops/radar-01c/intelligence-spike-screener-test.php && php ops/radar-01c/intelligence-pipeline-test.php && php ops/radar-01c/intelligence-discovery-preflight-test.php && php ops/radar-01c/intelligence-public-report-summary-test.php && php ops/radar-01c/intelligence-discovery-snapshot-test.php && php ops/radar-01c/intelligence-report-read-model-test.php
