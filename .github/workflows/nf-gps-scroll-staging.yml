name: Native GPS verified-address scroll — staging only
on:
  push:
    branches: [deploy/nf-gps-scroll]
permissions:
  contents: read
concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Verify reviewed application and isolated presentation scope
        run: |
          set -euo pipefail
          git diff --quiet 7e4a70ab2cea7b0e6f8b81544fc675af783be7f9 HEAD -- wordpress tests
          test "$(git diff --name-only 7e4a70ab2cea7b0e6f8b81544fc675af783be7f9 HEAD)" = '.github/workflows/nf-gps-scroll-staging.yml'
          test "$(git diff --name-only 1a79e09527adc6cac8dbc9bc2e5217a57fbed7b4 HEAD -- wordpress)" = 'wordpress/themes/badaround-child/assets/js/native-report/location-map.js'
          git diff --check 1a79e09527adc6cac8dbc9bc2e5217a57fbed7b4 HEAD
          node --check wordpress/themes/badaround-child/assets/js/native-report/location-map.js
          find wordpress/plugins/badaround-core wordpress/themes/badaround-child -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Native and Smart Address regression
        run: |
          set -euo pipefail
          npm ci --prefix tests
          node --test --test-concurrency=2 tests/native-report-f16.cjs tests/native-report-f16-dom.cjs tests/native-report-f19-ux.cjs tests/nf-final-01-ux.cjs tests/nf-visual-02-cards.cjs tests/nf-ux-03-compact.cjs tests/nf-ux-07-submit-feedback.cjs tests/f1-ux-beta-01.cjs tests/f1-15b-r5-smart-address.cjs tests/sf8-national-territory.cjs tests/sf9-public-privacy-boundary.cjs tests/native-media-f17d-dom.cjs tests/native-media-f17d-extra.cjs
          for file in tests/native-report-f16.php tests/native-report-f13.php tests/native-report-f14.php tests/native-report-f15.php tests/f1-15a3-territory.php tests/f1-14r-publication-contract.php tests/f1-14r-consumers.php tests/map-02r-priv-01.php; do php "$file" >/dev/null; done
      - name: Browser regression and GPS scroll on Chromium and WebKit
        run: |
          set -euo pipefail
          npm install --prefix /tmp/nf-browser-runner --no-save playwright@1.62.1
          node /tmp/nf-browser-runner/node_modules/playwright/cli.js install --with-deps chromium webkit
          export BA_PLAYWRIGHT_MODULE=/tmp/nf-browser-runner/node_modules/playwright
          node tests/nf-final-01-browser.cjs
          node tests/nf-ux-06-location-browser.cjs
          node tests/nf-ux-09-icon-style-browser.cjs
          node tests/f1-ux-beta-01-browser.cjs
          BA_BROWSER_ENGINE=webkit node tests/nf-ux-06-location-browser.cjs
  deploy:
    needs: native
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare only location-map.js and verified baseline rollback
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/deploy/nf-gps-scroll'
          git diff --quiet 7e4a70ab2cea7b0e6f8b81544fc675af783be7f9 HEAD -- wordpress tests
          mkdir -p nf-new/assets/js/native-report nf-rollback/assets/js/native-report
          cp wordpress/themes/badaround-child/assets/js/native-report/location-map.js nf-new/assets/js/native-report/location-map.js
          git show 1a79e09527adc6cac8dbc9bc2e5217a57fbed7b4:wordpress/themes/badaround-child/assets/js/native-report/location-map.js > nf-rollback/assets/js/native-report/location-map.js
          test "$(find nf-new -type f | wc -l)" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: nf-gps-scroll-baseline-rollback
          path: nf-rollback/
          retention-days: 14
          if-no-files-found: error
      - name: Upload presentation adapter to staging
        id: upload
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./nf-new/
          server-dir: /staging.badaround.it/wp-content/themes/badaround-child/
          dangerous-clean-slate: false
          state-name: .nf-gps-scroll-state.json
          log-level: minimal
      - name: Retry transient upload failure
        if: steps.upload.outcome == 'failure'
        id: retry
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./nf-new/
          server-dir: /staging.badaround.it/wp-content/themes/badaround-child/
          dangerous-clean-slate: false
          state-name: .nf-gps-scroll-state.json
          log-level: minimal
      - name: Restore baseline if both uploads fail
        if: steps.upload.outcome == 'failure' && steps.retry.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./nf-rollback/
          server-dir: /staging.badaround.it/wp-content/themes/badaround-child/
          dangerous-clean-slate: false
          state-name: .nf-gps-scroll-rollback-state.json
          log-level: minimal
      - name: Confirm upload outcome
        run: |
          test '${{ steps.upload.outcome }}' = success || test '${{ steps.retry.outcome }}' = success
