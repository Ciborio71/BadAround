name: UX-RESPONSIVE-01B.1 guarded staging deploy
on:
  push:
    branches: [deploy/ux-responsive-01b1-staging]
    paths: ['ops/ux-responsive-01b1-deploy-launch.txt']
permissions:
  contents: read
  actions: read
concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
      BASELINE: 0c2863b2a1bfbfb1e5c9641c78ba8d28bd21f21c
      CANDIDATE: a38b1a50ee0ff2260a6b6ae906dcad20e8deff34
      QA_RUN: 40109646903
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a38b1a50ee0ff2260a6b6ae906dcad20e8deff34
          fetch-depth: 0
      - name: Verify candidate QA and exact runtime scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/deploy/ux-responsive-01b1-staging
          python - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request('https://api.github.com/repos/Ciborio71/BadAround/actions/runs/'+os.environ['QA_RUN'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r:j=json.load(r)
          assert j['head_sha']==os.environ['CANDIDATE'] and j['conclusion']=='success'
          PY
          cat > files.txt <<'EOF'
          themes/badaround-child/assets/css/map-navigation.css
          themes/badaround-child/assets/css/map.css
          themes/badaround-child/assets/css/pages.css
          EOF
          git diff --name-only "$BASELINE" "$CANDIDATE" -- wordpress | sort > affected.txt
          sed 's|^|wordpress/|' files.txt | sort > expected.txt
          cmp affected.txt expected.txt
          git diff --check "$BASELINE" "$CANDIDATE"
          mkdir -p old new rollback verified tls
          while IFS= read -r file; do
            git show "$BASELINE:wordpress/$file" > "old/$file"
            mkdir -p "new/$(dirname "$file")" "rollback/$(dirname "$file")" "verified/$(dirname "$file")"
            git show "$CANDIDATE:wordpress/$file" > "new/$file"
          done < files.txt
      - name: Verify FTPS TLS chain
        run: |
          set -euo pipefail
          ca=/etc/ssl/certs/ca-certificates.crt
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat tls/yr2.pem tls/yr-by-x1.pem > tls/untrusted.pem
          cat "$ca" tls/untrusted.pem > tls/curl-chain.pem
          openssl verify -CAfile "$ca" -untrusted tls/yr-by-x1.pem tls/yr2.pem
          timeout 30s openssl s_client -starttls ftp -connect "${FTP_HOST}:21" -servername "$FTP_TLS_NAME" -verify_hostname "$FTP_TLS_NAME" -verify_return_error -CAfile tls/curl-chain.pem < /dev/null > tls/handshake.log 2>&1
          grep -q 'Verify return code: 0 (ok)' tls/handshake.log
      - name: Capture remote baseline and rollback bytes
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            remote="ftp://${FTP_TLS_NAME}:21/staging.badaround.it/wp-content/$file"
            curl --fail --silent --show-error --ssl-reqd --cacert tls/curl-chain.pem --connect-to "${FTP_TLS_NAME}:21:${FTP_HOST}:21" --user "$FTP_USER:$FTP_PASS" --connect-timeout 12 --max-time 90 "$remote" -o "rollback/$file"
            cmp "rollback/$file" "old/$file"
            sha256sum "rollback/$file" "new/$file"
          done < files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ux-responsive-01b1-byte-exact-rollback
          path: rollback/
          retention-days: 90
      - name: Upload only three authorized CSS files
        id: upload
        continue-on-error: true
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            remote="ftp://${FTP_TLS_NAME}:21/staging.badaround.it/wp-content/$file"
            curl --fail --silent --show-error --ssl-reqd --cacert tls/curl-chain.pem --connect-to "${FTP_TLS_NAME}:21:${FTP_HOST}:21" --user "$FTP_USER:$FTP_PASS" --connect-timeout 12 --max-time 90 --upload-file "new/$file" "$remote"
          done < files.txt
      - name: Verify remote candidate bytes
        id: verify
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            remote="ftp://${FTP_TLS_NAME}:21/staging.badaround.it/wp-content/$file"
            curl --fail --silent --show-error --ssl-reqd --cacert tls/curl-chain.pem --connect-to "${FTP_TLS_NAME}:21:${FTP_HOST}:21" --user "$FTP_USER:$FTP_PASS" --connect-timeout 12 --max-time 90 "$remote" -o "verified/$file"
            cmp "verified/$file" "new/$file"
            sha256sum "verified/$file" | tee -a remote-sha256.txt
          done < files.txt
      - name: Public HTTP smoke
        id: smoke
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 https://staging.badaround.it/mappa/ -o map.html
          grep -q 'ba-map-workspace' map.html
          grep -q 'assets/css/map.css' map.html
      - name: Roll back on upload verification or smoke failure
        if: always() && (steps.upload.outcome == 'failure' || steps.verify.outcome != 'success' || steps.smoke.outcome != 'success')
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            remote="ftp://${FTP_TLS_NAME}:21/staging.badaround.it/wp-content/$file"
            curl --fail --silent --show-error --ssl-reqd --cacert tls/curl-chain.pem --connect-to "${FTP_TLS_NAME}:21:${FTP_HOST}:21" --user "$FTP_USER:$FTP_PASS" --connect-timeout 12 --max-time 90 --upload-file "rollback/$file" "$remote"
            curl --fail --silent --show-error --ssl-reqd --cacert tls/curl-chain.pem --connect-to "${FTP_TLS_NAME}:21:${FTP_HOST}:21" --user "$FTP_USER:$FTP_PASS" --connect-timeout 12 --max-time 90 "$remote" -o "verified/$file"
            cmp "verified/$file" "rollback/$file"
          done < files.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-responsive-01b1-deploy-evidence
          path: |
            remote-sha256.txt
            tls/handshake.log
          retention-days: 90
          if-no-files-found: ignore
      - name: Final deploy gate
        if: always()
        run: |
          test '${{ steps.upload.outcome }}' = success
          test '${{ steps.verify.outcome }}' = success
          test '${{ steps.smoke.outcome }}' = success
