name: GEO-PRIV-02B — Single File Staging Deploy
on:
  push:
    branches:
      - deploy/geo-priv-02b-staging
permissions:
  contents: read
concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout frozen tested patch
        uses: actions/checkout@v4
        with:
          ref: a7bdbc04b7edd69ae17364bbd45d01190b495b7f
          fetch-depth: 2
      - name: Verify permitted one-file patch and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'a7bdbc04b7edd69ae17364bbd45d01190b495b7f'
          test "$(git diff --name-only 25b9ff5ad9d747b10cef7c2f3981fab15fbe4ed3 HEAD)" = 'wordpress/plugins/badaround-core/includes/class-badaround-publication-service.php'
          php -l wordpress/plugins/badaround-core/includes/class-badaround-publication-service.php
          php tests/f1-14r-publication-contract.php
          php tests/f1-14r-consumers.php
      - name: Prepare one-file payload and verified baseline rollback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p geo-new geo-rollback
          FILE=wordpress/plugins/badaround-core/includes/class-badaround-publication-service.php
          cp "$FILE" geo-new/class-badaround-publication-service.php
          git show 25b9ff5ad9d747b10cef7c2f3981fab15fbe4ed3:"$FILE" > geo-rollback/class-badaround-publication-service.php
          test "$(find geo-new -type f | wc -l)" -eq 1
          test "$(find geo-rollback -type f | wc -l)" -eq 1
          cmp "$FILE" geo-new/class-badaround-publication-service.php
          sha256sum geo-new/* geo-rollback/* > geo-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: geo-priv-02b-baseline-rollback
          path: |
            geo-rollback/
            geo-manifest.txt
          retention-days: 14
      - name: Deploy isolated PHP file (attempt 1)
        id: upload
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./geo-new/
          server-dir: /staging.badaround.it/wp-content/plugins/badaround-core/includes/
          state-name: .geo-priv-02b-single-file-state.json
          dangerous-clean-slate: false
          log-level: minimal
      - name: Retry transient FTPS failure (attempt 2)
        id: retry2
        if: steps.upload.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./geo-new/
          server-dir: /staging.badaround.it/wp-content/plugins/badaround-core/includes/
          state-name: .geo-priv-02b-single-file-state.json
          dangerous-clean-slate: false
          log-level: minimal
      - name: Retry transient FTPS failure (attempt 3)
        id: retry3
        if: steps.upload.outcome == 'failure' && steps.retry2.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./geo-new/
          server-dir: /staging.badaround.it/wp-content/plugins/badaround-core/includes/
          state-name: .geo-priv-02b-single-file-state.json
          dangerous-clean-slate: false
          log-level: minimal
      - name: Restore known baseline after all upload attempts fail
        if: steps.upload.outcome == 'failure' && steps.retry2.outcome == 'failure' && steps.retry3.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./geo-rollback/
          server-dir: /staging.badaround.it/wp-content/plugins/badaround-core/includes/
          state-name: .geo-priv-02b-rollback-state.json
          dangerous-clean-slate: false
          log-level: minimal
      - name: Confirm transfer before external live-file verification
        run: |
          if [ '${{ steps.upload.outcome }}' = success ] || [ '${{ steps.retry2.outcome }}' = success ] || [ '${{ steps.retry3.outcome }}' = success ]; then
            echo 'One-file transfer reported success; external byte-for-byte check required.'
          else
            echo 'All attempts failed; do not perform event recovery.'
            exit 1
          fi
