name: BadAround event header alignment guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - tools/ba_event_header_release.py
      - .github/workflows/ba-event-header.yml
permissions:
  contents: read
concurrency:
  group: ba-event-header-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[event-header-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 951d407a42bd2fb435f5fe1894608e062a70dfcd
          path: prior-source
          persist-credentials: false
      - name: Verify template and guarded deployment
        run: |
          php -l wordpress/themes/badaround-child/template-parts/single-event-layout.php
          python3 -m py_compile tools/ba_event_header_release.py
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install only the event template and scoped CSS
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_event_header_release.py
