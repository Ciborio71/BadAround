name: BadAround event form polish guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - tools/ba_event_form_polish_release.py
      - .github/workflows/ba-event-form-polish.yml
permissions:
  contents: read
concurrency:
  group: ba-event-form-polish-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[event-form-polish-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: d9bea5f40cc9a63ca6a40532e5cd825f76f4f5d5
          path: prior-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify contribution interaction and map regressions
        run: |
          npm ci --prefix tests --ignore-scripts
          php -l wordpress/plugins/badaround-core/includes/class-badaround-contribution-service.php
          php -l wordpress/plugins/badaround-core/identity-dormant/wordpress-comment-form.php
          php tests/test-ba-event-public-details.php
          php tests/test-ba-community-review.php
          node --test tests/contribution-ux.cjs tests/event-detail-lazy-map.cjs tests/home-proximity.cjs tests/test-ba-community-ui.cjs
          node --check wordpress/themes/badaround-child/assets/js/map.js
          node --check wordpress/plugins/badaround-core/assets/js/contributions.js
          python3 -m py_compile tools/ba_event_form_polish_release.py
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install event form polish UX
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_event_form_polish_release.py
