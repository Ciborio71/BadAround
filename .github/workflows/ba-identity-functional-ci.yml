  identity-dormant-release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[identity-private-release]')
    needs: [identity-primitives, identity-mysql]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned previous production modules
        uses: actions/checkout@v4
        with:
          ref: b0d5bca20d571cb753d03aebcc5458357a760643
          path: prior-source
          persist-credentials: false
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Verify live baseline and deploy three dormant modules
        env:
          FTP_HOST: "46.231.24.137"
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
          BA_CREATOR_RELEASE_MODE: deploy
        run: python3 tools/ba_identity_creator_grant_release.py
      - name: Retain release verification
        uses: actions/upload-artifact@v4
        with:
          name: ba-identity-creator-grant-release
          path: creator-grant-release-evidence.json
          if-no-files-found: error
          retention-days: 14

