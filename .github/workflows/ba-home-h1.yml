name: BadAround Home H1 guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - wordpress/themes/badaround-child/assets/css/home.css
      - tools/ba_home_h1_release.py
      - .github/workflows/ba-home-h1.yml
permissions:
  contents: read
concurrency:
  group: ba-home-h1-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[home-h1-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: cddd5498e934dac362c7ddcda8f64ec8fcc51781
          path: prior-source
          persist-credentials: false
      - name: Validate guarded driver
        run: python3 -m py_compile tools/ba_home_h1_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install only the scoped Home CSS with verified backup
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_home_h1_release.py
