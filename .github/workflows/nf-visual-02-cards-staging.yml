name: NF-VISUAL-02 — Native cards staging deploy
on:
  push:
    branches:
      - deploy/nf-visual-02-cards
permissions:
  contents: read
concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify authorized application and workflow-only delta
        run: |
          set -euo pipefail
          git diff --quiet 00b823baf3412ca3fae30874325aa9114cf5a964 HEAD -- wordpress tests
          test "$(git diff --name-only 00b823baf3412ca3fae30874325aa9114cf5a964 HEAD)" = '.github/workflows/nf-visual-02-cards-staging.yml'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Native PHP and JS syntax
        run: |
          set -euo pipefail
          find wordpress/plugins/badaround-core wordpress/themes/badaround-child -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          for p in model wizard api smart-address media media-view errors; do
            node --check "wordpress/themes/badaround-child/assets/js/native-report/$p.js"
          done
      - name: Native Form end-to-end synthetic UX, privacy, smart address and media DOM
        run: |
          set -euo pipefail
          npm ci --prefix tests
          node --test \
            tests/native-report-f16.cjs \
            tests/native-report-f16-dom.cjs \
            tests/native-report-f19-ux.cjs \
            tests/nf-final-01-ux.cjs \
            tests/nf-visual-02-cards.cjs \
            tests/f1-15b-r5-smart-address.cjs \
            tests/sf8-national-territory.cjs \
            tests/sf9-public-privacy-boundary.cjs \
            tests/native-media-f17d-dom.cjs \
            tests/native-media-f17d-extra.cjs
      - name: Native backend, publication, territory, and media synthetic constraints
        run: |
          set -euo pipefail
          for file in \
            tests/native-report-f13.php \
            tests/native-report-f14.php \
            tests/native-report-f15.php \
            tests/f1-15a3-territory.php \
            tests/f1-14r-publication-contract.php \
            tests/f1-14r-consumers.php \
            tests/map-02r-priv-01.php
          do php "$file" >/dev/null; done
      - name: Local browser smoke (all requests intercepted, no WordPress writes)
        run: |
          npm install --prefix /tmp/nf-browser-runner --no-save playwright@1.62.1
          node /tmp/nf-browser-runner/node_modules/playwright/cli.js install --with-deps chromium
          BA_PLAYWRIGHT_MODULE=/tmp/nf-browser-runner/node_modules/playwright node tests/nf-final-01-browser.cjs
      - name: Protect frozen backend and data contracts
        run: |
          set -euo pipefail
          git diff --check 9a94937 HEAD
          test -z "$(git diff --name-only 8b73163 HEAD -- wordpress/plugins tests/fixtures wordpress/themes/badaround-child/assets/js/native-report/smart-address.js)"
  deploy:
    needs: native
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare only four authorized UI files and verified baseline rollback
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/deploy/nf-visual-02-cards'
          git diff --quiet 00b823baf3412ca3fae30874325aa9114cf5a964 HEAD -- wordpress tests
          for path in assets/css/native-report.css assets/js/native-report/errors.js assets/js/native-report/wizard.js assets/js/native-report/media-view.js; do
            mkdir -p "nf-new/$(dirname "$path")" "nf-rollback/$(dirname "$path")"
            cp "wordpress/themes/badaround-child/$path" "nf-new/$path"
            git show "8b73163ea2051c1476f1c8e8498bb1250824d36f:wordpress/themes/badaround-child/$path" > "nf-rollback/$path"
          done
          test "$(find nf-new -type f | wc -l)" -eq 4
          test "$(find nf-rollback -type f | wc -l)" -eq 4
          find nf-new nf-rollback -type f -exec sha256sum {} + > nf-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nf-visual-02-predeploy-rollback
          path: |
            nf-rollback/
            nf-manifest.txt
          retention-days: 14
          if-no-files-found: error
      - name: Upload four Native UI files to staging only
        id: upload
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./nf-new/
          server-dir: /staging.badaround.it/wp-content/themes/badaround-child/
          dangerous-clean-slate: false
          state-name: .nf-visual-02-state.json
          log-level: minimal
      - name: Restore verified baseline if upload fails
        if: steps.upload.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./nf-rollback/
          server-dir: /staging.badaround.it/wp-content/themes/badaround-child/
          dangerous-clean-slate: false
          state-name: .nf-visual-02-rollback-state.json
          log-level: minimal
      - name: Confirm upload outcome
        run: test '${{ steps.upload.outcome }}' = success
      - name: Record upload completion and external verification requirement
        run: |
          echo 'Four-file staging upload completed. Authenticated active-theme source comparison is required before certification; runner HTTP smoke is unavailable (known 403).'
