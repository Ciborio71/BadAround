name: GEO-PRIV-02B — Single File Staging Deploy
on:
  push:
    branches:
      - deploy/geo-priv-02b-staging
permissions:
  contents: read
concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout frozen tested patch
        uses: actions/checkout@v4
        with:
          ref: a7bdbc04b7edd69ae17364bbd45d01190b495b7f
          fetch-depth: 2
      - name: Verify permitted one-file patch and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'a7bdbc04b7edd69ae17364bbd45d01190b495b7f'
          test "$(git diff --name-only 25b9ff5ad9d747b10cef7c2f3981fab15fbe4ed3 HEAD)" = 'wordpress/plugins/badaround-core/includes/class-badaround-publication-service.php'
          php -l wordpress/plugins/badaround-core/includes/class-badaround-publication-service.php
          php tests/f1-14r-publication-contract.php
          php tests/f1-14r-consumers.php
      - name: Verify single-file payload and prepare isolated transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/geo-priv-one-file
          cp wordpress/plugins/badaround-core/includes/class-badaround-publication-service.php /tmp/geo-priv-one-file/class-badaround-publication-service.php
          cmp /tmp/geo-priv-one-file/class-badaround-publication-service.php wordpress/plugins/badaround-core/includes/class-badaround-publication-service.php
      - name: Transfer one Publication Service file via established FTPS action
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: /tmp/geo-priv-one-file/
          server-dir: /staging.badaround.it/wp-content/plugins/badaround-core/includes/
          state-name: .geo-priv-02b-single-file-state.json
          dangerous-clean-slate: false
          log-level: minimal
