name: BadAround wizard step header guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - tools/ba_wizard_step_header_release.py
      - .github/workflows/ba-wizard-step-header.yml
permissions:
  contents: read
concurrency:
  group: ba-wizard-step-header-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[wizard-step-header-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: e788eae09a83485e09f7a64fdc307abc787f851b
          path: prior-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify map card, updated choice label and wizard regressions
        run: |
          npm ci --prefix tests --ignore-scripts
          node --check wordpress/themes/badaround-child/assets/js/native-report/wizard.js
          php -l wordpress/themes/badaround-child/template-parts/native-report/shell.php
          php -l wordpress/themes/badaround-child/functions.php
          php -l wordpress/themes/badaround-child/header.php
          php -l wordpress/themes/badaround-child/footer.php
          php tests/geo-prec-01-publication.php
          php tests/geo-area-01-publication.php
          node --test tests/f1-15b-r5-smart-address.cjs tests/native-report-f16-dom.cjs tests/native-report-f19-ux.cjs tests/geo-public-03-choice.cjs tests/geo-area-01-model.cjs
          python3 -m py_compile tools/ba_wizard_step_header_release.py
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install wizard step header UX
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_wizard_step_header_release.py
