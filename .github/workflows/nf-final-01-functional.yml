name: NF-FINAL-01 targeted backend audit completion
on:
  push:
    branches: [qa/nf-final-01-functional-certification]
    paths: ['.github/workflows/nf-final-01-functional.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, gd
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Complete targeted backend checks; current Native 126 tests and 60-file custody retained from run 40093239346
        run: |
          mkdir -p evidence/nf-final-01
          fail=0
          for f in geo-area-01-consumers geo-prec-01-moderation geo-priv-03a5a-classic-form native-social-preference f1-14r-publication-contract f1-14r-consumers ui-admin-01-scope ui-admin-01-rejection; do
            echo "RUN $f"
            php tests/$f.php > evidence/nf-final-01/$f.txt 2>&1 || fail=1
            tail -3 evidence/nf-final-01/$f.txt
          done
          exit "$fail"
      - name: Current territorial resolver hierarchy
        if: always()
        run: node --test tests/sf8-national-territory.cjs > evidence/nf-final-01/territory.txt
      - name: PHP syntax
        if: always()
        run: find wordpress/plugins/badaround-core wordpress/themes/badaround-child -name '*.php' -type f -print0 | xargs -0 -n1 php -l > evidence/nf-final-01/php-lint.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf-final-01-targeted-backend-completion
          path: evidence/nf-final-01/
          retention-days: 90
