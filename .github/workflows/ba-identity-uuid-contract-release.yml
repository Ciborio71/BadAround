name: BA Identity UUID contract targeted production fix
on:
  push:
    branches:
      - reconcile/identity-production-baseline-20261104
    paths:
      - .github/workflows/ba-identity-uuid-contract-release.yml
permissions:
  contents: read
concurrency:
  group: badaround-targeted-production-deploy
  cancel-in-progress: false
jobs:
  fix:
    if: "github.event.head_commit.message == 'release: apply verified native UUID contract fix'"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 42078e111a53340aa31a69d510511fb80a34f2da
          path: pinned-source
          persist-credentials: false
      - name: Verify source contract
        run: |
          set -euo pipefail
          cp pinned-source/wordpress/plugins/badaround-core/identity-dormant/pre-intake-reservation.php _ba_prior_uuid_contract.php
          python3 -m py_compile tools/ba_uuid_contract_guarded_release.py
          php -l wordpress/plugins/badaround-core/identity-dormant/pre-intake-reservation.php
          php tests/test-ba-locked-canonical-reader.php
      - name: Check production Core and prior module bytes read-only
        env:
          FTP_HOST: '46.231.24.137'
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          BA_UUID_CONTRACT_MODE: preflight
        run: python3 tools/ba_uuid_contract_guarded_release.py
      - name: Correct only dormant native intake UUID validation
        env:
          FTP_HOST: '46.231.24.137'
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          BA_UUID_CONTRACT_MODE: deploy
        run: python3 tools/ba_uuid_contract_guarded_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ba-identity-uuid-contract-deploy
          path: ba-intake-contract-release-evidence.json
          retention-days: 10
          if-no-files-found: ignore

# Explicit one-time dormant compatibility fix only.
