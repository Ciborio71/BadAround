name: BadAround event interaction, placeholders and social links guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - tools/ba_event_presentation_release.py
      - .github/workflows/ba-event-presentation.yml
permissions:
  contents: read
concurrency:
  group: ba-event-presentation-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[event-presentation-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1edfbe3f2a49a4af251b4f648b6bbea9c812535b
          path: prior-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify event interaction, placeholders and social links and access regressions
        run: |
          npm ci --prefix tests --ignore-scripts
          find wordpress/themes/badaround-child/inc wordpress/plugins/badaround-core/identity-dormant -name "*.php" -exec php -l {} \; > /dev/null
          php -l wordpress/themes/badaround-child/functions.php
          php -l wordpress/themes/badaround-child/template-parts/single-event-layout.php
          php -l wordpress/themes/badaround-child/template-parts/components/event-card.php
          php -l wordpress/plugins/badaround-core/includes/class-badaround-contribution-service.php
          php tests/event-social-links.php
          php tests/event-gallery.php
          php tests/event-section-headings.php
          php tests/event-publication-policy.php
          php tests/event-structured-data.php
          php tests/home-proximity.php
          php tests/contributions-e5.php
          node --test tests/contribution-ux.cjs tests/test-ba-community-ui.cjs tests/event-gallery.cjs tests/home-lighthouse-assets.cjs tests/home-proximity.cjs tests/perf-polish-01-map-loading.cjs
          npm install --no-save --prefix tests playwright-core
          BA_CHROMIUM=/usr/bin/google-chrome node tests/event-interaction-browser.cjs
          python3 -m py_compile tools/ba_event_presentation_release.py
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install event interaction, placeholders and social links rendering
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_event_presentation_release.py
