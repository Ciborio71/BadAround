name: BadAround branded category placeholders guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - tools/ba_branded_placeholders_release.py
      - .github/workflows/ba-branded-placeholders.yml
permissions:
  contents: read
concurrency:
  group: ba-branded-placeholders-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[branded-placeholders-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 9e06eee31a3561adcd1b23c96e12db843ca0f05e
          path: prior-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify branded category placeholders and access regressions
        run: |
          npm ci --prefix tests --ignore-scripts
          php -l wordpress/themes/badaround-child/functions.php
          node --test tests/home-lighthouse-assets.cjs
          php tests/event-gallery.php
          python3 -m py_compile tools/ba_branded_placeholders_release.py
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install branded category placeholders rendering
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_branded_placeholders_release.py
