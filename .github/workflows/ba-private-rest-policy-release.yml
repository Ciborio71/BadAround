name: BA Identity private REST policy guarded release
on:
  push:
    branches:
      - reconcile/identity-production-baseline-20261104
    paths:
      - .github/workflows/ba-private-rest-policy-release.yml
permissions:
  contents: read
concurrency:
  group: badaround-targeted-production-deploy
  cancel-in-progress: false
jobs:
  release:
    if: "github.event.head_commit.message == 'release: apply guarded Identity private REST policy'"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 42078e111a53340aa31a69d510511fb80a34f2da
          path: pinned-prior
          persist-credentials: false
      - name: Verify previous code and PHP syntax
        run: |
          set -euo pipefail
          cp pinned-prior/wordpress/plugins/badaround-core/identity-dormant/wordpress-qa-report-rest.php _ba_prior_private_report_rest.php
          python3 -m py_compile tools/ba_private_rest_policy_release.py
          php -l wordpress/plugins/badaround-core/identity-dormant/wordpress-qa-report-rest.php
          php tests/test-ba-wordpress-qa-report-transport.php
      - name: Compare live Core and dormant source, no writes
        env:
          FTP_HOST: '46.231.24.137'
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          BA_PRIVATE_REST_MODE: preflight
        run: python3 tools/ba_private_rest_policy_release.py
      - name: Deploy only modified dormant QA REST class
        env:
          FTP_HOST: '46.231.24.137'
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          BA_PRIVATE_REST_MODE: deploy
        run: python3 tools/ba_private_rest_policy_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ba-private-rest-policy-evidence
          path: ba-private-rest-policy-release.json
          retention-days: 14
          if-no-files-found: ignore
