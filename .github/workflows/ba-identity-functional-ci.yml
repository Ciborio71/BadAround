  identity-feedback-release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[identity-feedback-release]')
    needs: [identity-primitives, identity-mysql]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 8d97fe55192c2638d4354ff14ff81eb29101a87b
          path: prior-source
          persist-credentials: false
      - run: |
          php -l wordpress/plugins/badaround-core/identity-dormant/wordpress-identity-portal.php
          php -l wordpress/plugins/badaround-core/identity-dormant/wordpress-community-review.php
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install scoped feedback styling with verified backups
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ftplib,ssl,os,io,re,hashlib
          base='/httpdocs/wp-content/plugins/badaround-core/identity-dormant/'
          source=Path('wordpress/plugins/badaround-core/identity-dormant')
          names=['identity-feedback.css','wordpress-identity-portal.php','wordpress-community-review.php']
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(cafile='tls/chain.pem'),timeout=40)
          ftp.connect('46.231.24.137',21);ftp.host='hostmld17.aziendeitalia.com'
          ftp.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);ftp.prot_p()
          def read(path):
              b=io.BytesIO()
              try:ftp.retrbinary('RETR '+path,b.write)
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return None
                  raise
              return b.getvalue()
          run=os.environ['GITHUB_RUN_ID']
          old={};new={};mode={};installed=[]
          def paths(name):
              stem='/wordpress-backups/ba-identity-feedback-'+run+'-'+name
              return stem+'.prior',stem+'.part'
          try:
              core='/httpdocs/wp-content/plugins/badaround-core/badaround-core.php'
              if hashlib.sha256(read(core) or b'').hexdigest()!='18cb9ad21a63e08449eb85b7cb9233846bb02e2c472d05f118cd7d5764b7d175':raise RuntimeError('Core baseline differs')
              for name in names:
                  prior=Path('prior-source')/source/name
                  old[name]=prior.read_bytes() if prior.exists() else None
                  new[name]=(source/name).read_bytes()
                  if read(base+name)!=old[name]:raise RuntimeError('Live source differs: '+name)
                  if old[name] is not None:
                      match=re.search(r'(?i)unix\.mode=([0-7]{3,4});',ftp.sendcmd('MLST '+base+name))
                      if match is None:raise RuntimeError('Cannot verify file mode')
                      mode[name]=match.group(1)
                  else:mode[name]='644'
                  backup,temp=paths(name)
                  if read(backup) is not None or read(temp) is not None:raise RuntimeError('Protected destination occupied')
              for name in names:
                  backup,temp=paths(name)
                  if old[name] is not None:
                      ftp.storbinary('STOR '+backup,io.BytesIO(old[name]))
                      ftp.sendcmd('SITE CHMOD 600 '+backup)
                      if read(backup)!=old[name]:raise RuntimeError('Backup mismatch')
                  ftp.storbinary('STOR '+temp,io.BytesIO(new[name]))
                  ftp.sendcmd('SITE CHMOD '+mode[name]+' '+temp)
                  if read(temp)!=new[name]:raise RuntimeError('Temporary source mismatch')
              for name in names:
                  backup,temp=paths(name)
                  if read(base+name)!=old[name]:raise RuntimeError('Concurrent source change')
                  ftp.rename(temp,base+name);installed.append(name)
                  if read(base+name)!=new[name]:raise RuntimeError('Installed source mismatch')
              if any(read(base+name)!=new[name] for name in names):raise RuntimeError('Post-release source mismatch')
              print('IDENTITY_FEEDBACK_STYLE_RELEASE_PASS: scoped CSS and two presenters; backups verified; no data or flags changed')
          except Exception:
              for name in reversed(installed):
                  backup,temp=paths(name)
                  if read(base+name)!=new[name]:raise RuntimeError('Concurrent drift prevents rollback') from None
                  if old[name] is None:ftp.delete(base+name)
                  else:
                      if read(backup)!=old[name]:raise RuntimeError('Rollback backup mismatch') from None
                      ftp.sendcmd('SITE CHMOD '+mode[name]+' '+backup)
                      ftp.rename(backup,base+name)
                  if read(base+name)!=old[name]:raise RuntimeError('Rollback verification failed') from None
              raise
          finally:ftp.quit()
          PY
