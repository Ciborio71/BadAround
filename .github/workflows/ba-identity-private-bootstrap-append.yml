name: BA-IDENTITY append inactive private bootstrap
on:
  push:
    branches:
      - feature/ba-identity-01c-dormant-20261103
    paths:
      - .github/workflows/ba-identity-private-bootstrap-append.yml
permissions:
  contents: read
concurrency:
  group: badaround-production-scoped-ftps
  cancel-in-progress: false
jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.3 for syntax and preflight
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_mysql, pdo_sqlite
          coverage: none
      - name: Self-tests, no live database
        run: |
          php prototypes/ba-identity-01c/test-wordpress-privacy-notice.php
          php prototypes/ba-identity-01c/test-wordpress-private-bootstrap.php
          php prototypes/ba-identity-01c/test-wordpress-runtime-loader.php
      - name: Append 3 dormant QA files without changing Core
        env:
          FTP_HOST: "46.231.24.137"
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
        run: python3 .github/scripts/ba_identity_private_bootstrap_append.py
