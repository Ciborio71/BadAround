name: Deploy HOME-HEADINGS-03 spacing

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (read only) or deploy (write after review)"
        type: choice
        options:
          - dry-run
          - deploy
        default: dry-run
        required: true
      confirmation:
        description: "For deploy only: type DEPLOY"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: badaround-home-headings-production
  cancel-in-progress: false

jobs:
  patch-live-baseline:
    if: ${{ inputs.mode == 'dry-run' || (inputs.mode == 'deploy' && inputs.confirmation == 'DEPLOY') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout approved deploy script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate script syntax
        run: python3 -m py_compile .github/scripts/home_headings_03_spacing.py
      - name: Patch current live files (dry-run by default)
        env:
          FTP_HOST: "46.231.24.137"
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          DEPLOY_MODE: ${{ inputs.mode }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: python3 .github/scripts/home_headings_03_spacing.py
