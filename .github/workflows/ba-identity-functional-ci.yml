name: BA-IDENTITY production-source functional CI
on:
  push:
    branches:
      - reconcile/identity-production-baseline-20261104
    paths:
      - wordpress/plugins/badaround-core/identity-dormant/**
      - .github/workflows/ba-identity-functional-ci.yml
      - tests/test-ba-native-report-receipt.php
      - tests/test-ba-native-ownership-coordinator.php
      - tests/test-ba-durable-ownership-handoff.php
      - tests/test-ba-durable-ownership-mysql.php
      - tests/test-ba-ownership-recovery-reconciler.php
      - tests/test-ba-native-intake-gate.php
      - tests/test-ba-native-intake-orchestrator.php
      - tests/test-ba-pre-intake-mysql.php
      - tests/test-ba-pre-reserved-native-intake.php
      - tests/test-ba-pre-intake-recovery-worker.php
      - tests/test-ba-pre-intake-schema-mysql.php
      - tests/test-ba-wordpress-recovery-composition-mysql.php
      - tests/test-ba-wordpress-qa-report-transport.php
      - tests/test-ba-wordpress-qa-report-composition-mysql.php
      - tests/test-ba-locked-canonical-reader.php
      - tests/test-ba-wordpress-native-receipt-proof-mysql.php
  workflow_dispatch:
concurrency:
  group: ba-identity-functional-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  identity-primitives:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout isolated prototype tests
        uses: actions/checkout@v4
        with:
          ref: feature/ba-identity-01c-dormant-20261103
          path: prototype-source
          persist-credentials: false
      - name: Overlay verified production modules and new dormant bridge
        run: |
          set -eu
          src=wordpress/plugins/badaround-core/identity-dormant
          dest=prototype-source/prototypes/ba-identity-01c
          test -d "$src"
          test -d "$dest"
          count=0
          for file in "$src"/*.php "$src"/*.js; do
            test -f "$file" || continue
            cp "$file" "$dest/"
            count=$((count+1))
          done
          test "$count" -eq 83
          echo "PRODUCTION_SOURCE_TEST_OVERLAY=PASS count=$count"
      - name: Prepare PHP 8.3 with required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_mysql, pcntl
          coverage: none
      - name: Verify fail-closed wizard receipt bridge
        run: |
          php -l wordpress/plugins/badaround-core/identity-dormant/native-report-receipt.php
          php -l tests/test-ba-native-report-receipt.php
          php tests/test-ba-native-report-receipt.php
          php -l wordpress/plugins/badaround-core/identity-dormant/native-ownership-coordinator.php
          php -l tests/test-ba-native-ownership-coordinator.php
          php tests/test-ba-native-ownership-coordinator.php
          php -l wordpress/plugins/badaround-core/identity-dormant/durable-ownership-handoff.php
          php -l wordpress/plugins/badaround-core/identity-dormant/recovery-store-bridge.php
          php -l tests/test-ba-durable-ownership-handoff.php
          php tests/test-ba-durable-ownership-handoff.php
          php -l wordpress/plugins/badaround-core/identity-dormant/ownership-recovery-reconciler.php
          php -l wordpress/plugins/badaround-core/identity-dormant/recovery-owner-bridge.php
          php -l tests/test-ba-ownership-recovery-reconciler.php
          php tests/test-ba-ownership-recovery-reconciler.php
          php -l wordpress/plugins/badaround-core/identity-dormant/native-intake-gate.php
