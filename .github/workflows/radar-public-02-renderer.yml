name: Radar public renderer isolated
on:
  push:
    branches:
      - feature/radar-public-02-renderer
  pull_request:
    branches:
      - feature/radar-public-counts-safe-v1
permissions:
  contents: read
jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: |
          php -l wordpress/plugins/badaround-core/includes/class-badaround-radar-public-renderer.php
          php tests/radar-public-02-renderer.php
