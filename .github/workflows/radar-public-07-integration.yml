name: Radar public 07 integrated gate
on:
  push:
    branches:
      - qa/radar-public-07-integration-guard
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: |
          php -l wordpress/plugins/badaround-core/includes/class-badaround-radar-window-counts.php
          php -l wordpress/plugins/badaround-core/includes/class-badaround-radar-window-renderer.php
          php -l wordpress/themes/badaround-child/page-radar-demo.php
          php tests/radar-public-05-window-counts.php
          php tests/radar-public-06-window-renderer.php
          php tests/radar-public-07-integration.php
