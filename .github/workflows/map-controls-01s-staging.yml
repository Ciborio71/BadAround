name: MAP-CONTROLS-01R five-file staging deploy and live Google QA
on:
  push:
    branches: [deploy/map-controls-01r-staging]
    paths: ['ops/mapcontrols01s-launch.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, gd, posix, fileinfo, mbstring
      - name: Pinned candidate and dedicated pre-deploy success
        run: |
          set -euo pipefail
          mkdir -p tls evidence
          git diff --exit-code 56853ec079cbd9bdd1f466104790e07f54bb60d1 HEAD -- wordpress
          php -l ops/mapcontrols01s-probe.php
          python - <<'CHECK'
          import urllib.request,json,os
          req=urllib.request.Request('https://api.github.com/repos/Ciborio71/BadAround/actions/runs/39925438514',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req) as r:j=json.load(r)
          assert j['head_sha']=='56853ec079cbd9bdd1f466104790e07f54bb60d1' and j['conclusion']=='success'
          CHECK
      - name: Provision officially signed chain and verify against runner root trust
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASS"
          ca=/etc/ssl/certs/ca-certificates.crt
          test -s "$ca"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          test "$(openssl x509 -in tls/yr2.pem -noout -subject)" = "subject=C = US, O = Let's Encrypt, CN = YR2"
          test "$(openssl x509 -in tls/yr-by-x1.pem -noout -subject)" = "subject=C = US, O = ISRG, CN = Root YR"
          openssl verify -CAfile "$ca" -untrusted tls/yr-by-x1.pem tls/yr2.pem
          cat tls/yr2.pem tls/yr-by-x1.pem > tls/untrusted.pem
          cat "$ca" tls/untrusted.pem > tls/curl-chain.pem
          timeout 30s openssl s_client -starttls ftp -connect "${FTP_HOST}:21" -servername "$FTP_TLS_NAME" -verify_hostname "$FTP_TLS_NAME" -verify_return_error -CAfile tls/curl-chain.pem < /dev/null > tls/handshake.log 2>&1
          grep -q 'Verify return code: 0 (ok)' tls/handshake.log
          echo 'FTPS server identity and chain VERIFIED; strict TLS remains enabled.'
      - name: Pre-upload 59-file custody and five byte-exact rollback copies
        run: python ops/mapcontrols01s-deploy.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: mapcontrols01s-rollback-before-upload
          path: evidence/
          retention-days: 90
      - name: Temporary authenticated administrator plus token staging QA probe
        run: python ops/mapcontrols01s-deploy.py install-probe
      - name: Wait for database custody gate then upload ONLY five files
        run: python ops/mapcontrols01s-deploy.py deploy
      - uses: actions/upload-artifact@v4
        with:
          name: mapcontrols01s-after-upload-hashes
          path: evidence/
          retention-days: 90
      - name: Quick C.1 C.2 platform regression against pinned deployed sources
        run: |
          set -euo pipefail
          php tests/nf-ux-02c-immutability.php > evidence/c1-gate.log
          php tests/nf-ux-02c1-persistence.php > evidence/c1-persistence.log
          php tests/nf-ux-02c2-recovery.php > evidence/c2-recovery.log
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pinned semantic and public-consumer quick regression
        run: |
          set -euo pipefail
          php tests/geo-area-01-publication.php > evidence/publication-radius.log
          php tests/geo-area-01-consumers.php > evidence/consumers.log
          php tests/geo-area-01a-moderation.php > evidence/moderation-radius.log
          php tests/geo-prec-01-moderation.php > evidence/governance.log
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund
          node --test --test-concurrency=1 tests/nf-ux-04-model.cjs tests/nf-ux-04-service.cjs tests/geo-public-06-rendering.cjs tests/sf9-public-privacy-boundary.cjs tests/f1-15b-r5-smart-address.cjs tests/native-social-preference.cjs > evidence/semantic.log
      - name: Wait for real authorized staging QA; automatic rollback on failure/timeout
        run: python ops/mapcontrols01s-deploy.py watch
      - name: Rollback five files on any failure or cancellation
        if: failure() || cancelled()
        run: python ops/mapcontrols01s-deploy.py rollback
      - name: Remove temporary QA component and verify absence
        if: always()
        run: python ops/mapcontrols01s-deploy.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapcontrols01s-final-deploy-evidence
          path: evidence/
          retention-days: 90
