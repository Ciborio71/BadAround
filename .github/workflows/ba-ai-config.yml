name: BadAround inactive AI credential setup guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - wordpress/mu-plugins/badaround-ai-moderation-config.php
      - tests/ai-moderation-config.php
      - tools/ba_ai_config_release.py
      - .github/workflows/ba-ai-config.yml
permissions:
  contents: read
concurrency:
  group: ba-ai-config-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[ai-config-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 8ac0586b2cdd9c12a28003a8206367995099ae1d
          path: prior-source
          persist-credentials: false
      - name: Verify private configuration and authorization
        run: |
          php -l wordpress/mu-plugins/badaround-ai-moderation-config.php
          php tests/ai-moderation-config.php
          python3 -m py_compile tools/ba_ai_config_release.py
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install inactive setup module only
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_ai_config_release.py
