name: BadAround private QA dormant security release
on:
  push:
    branches:
      - reconcile/identity-production-baseline-20261104
    paths:
      - .github/workflows/ba-qa-security-two-file-release.yml
permissions:
  contents: read
concurrency:
  group: badaround-targeted-production-deploy
  cancel-in-progress: false
jobs:
  guarded-update:
    if: "github.event.head_commit.message == 'release: run verified QA security source update'"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 4c5f8bc088fb8370ac2f75c09485e099531aae1a
          path: prior-version
          persist-credentials: false
      - name: Verify source syntax and prior version
        run: |
          set -euo pipefail
          cp prior-version/wordpress/plugins/badaround-core/identity-dormant/wordpress-qa-report-rest.php _prior_qa_rest.php
          python3 -m py_compile tools/ba_qa_security_two_file_release.py
          php -l wordpress/plugins/badaround-core/identity-dormant/wordpress-qa-report-rest.php
          php -l wordpress/plugins/badaround-core/identity-dormant/wordpress-qa-readiness.php
      - name: Read-only remote preflight
        env:
          FTP_HOST: '46.231.24.137'
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          BA_QA_PATCH_MODE: preflight
        run: python3 tools/ba_qa_security_two_file_release.py
      - name: Protected production dormant-file deployment
        env:
          FTP_HOST: '46.231.24.137'
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          BA_QA_PATCH_MODE: deploy
        run: python3 tools/ba_qa_security_two_file_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ba-qa-security-source-release
          path: ba-qa-security-release-evidence.json
          retention-days: 14
          if-no-files-found: ignore

# One-time additive private QA safety rollout.
