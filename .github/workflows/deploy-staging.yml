name: Deploy child theme to staging

on:
  workflow_dispatch:
  push:
    branches:
      - feature/r1-3-global-navigation-404
    paths:
      - .github/workflows/deploy-staging.yml

permissions:
  contents: read

concurrency:
  group: badaround-staging-theme
  cancel-in-progress: false

jobs:
  validate:
    name: Validate BadAround child theme
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint child theme PHP
        run: find ./wordpress/themes/badaround-child -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  deploy:
    name: Deploy BadAround child theme
    needs: validate
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload child theme over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_SFTP_HOST }}
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./wordpress/themes/badaround-child/
          server-dir: /staging.badaround.it/wp-content/themes/badaround-child/
          dangerous-clean-slate: false
          log-level: minimal
