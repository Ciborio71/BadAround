name: NF-FINAL-01 Native UX pre-deploy gate
on:
  push:
    branches: [feature/nf-final-01-native-ux-consolidation]
permissions:
  contents: read
jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, posix, fileinfo, pdo_sqlite, mbstring
      - name: Immutable application boundary and frozen contract
        run: |
          set -euo pipefail
          mkdir -p evidence
          git diff --check
          git diff --name-only a4ef16aa067afc94a96cacd55a46a62d1248ed93 HEAD -- wordpress > evidence/runtime-files.txt
          python3 - <<'PY'
          from pathlib import Path
          expected=['assets/css/native-report.css','assets/js/native-report/errors.js','assets/js/native-report/location-map.js','assets/js/native-report/smart-address.js','assets/js/native-report/wizard.js','template-parts/native-report/step.php']
          assert Path('evidence/runtime-files.txt').read_text().splitlines()==['wordpress/themes/badaround-child/'+p for p in expected]
          PY
          git diff --exit-code a4ef16aa067afc94a96cacd55a46a62d1248ed93 HEAD -- wordpress/plugins wordpress/themes/badaround-child/inc/native-report.php wordpress/themes/badaround-child/assets/js/native-report/model.js wordpress/themes/badaround-child/assets/js/native-report/api.js wordpress/themes/badaround-child/assets/js/native-report/media.js wordpress/themes/badaround-child/assets/js/native-report/media-view.js wordpress/themes/badaround-child/front-page.php wordpress/themes/badaround-child/assets/css/home.css
          echo 'dc282153243ffb80f3bd4f2a222ea0f4c4f42806fba6f3a0bde0a76855bd8e3c  wordpress/plugins/badaround-core/contracts/nf-conditional-v1.0.json' | sha256sum -c -
          find wordpress/themes/badaround-child -name '*.php' -print0 | xargs -0 -n1 php -l > evidence/php-lint.log
          for f in wizard errors location-map smart-address; do node --check wordpress/themes/badaround-child/assets/js/native-report/$f.js; done
      - name: Quick V1 V2 C.1 C.2 GEO Social media regression
        run: |
          set -euo pipefail
          for test in native-report-f12 native-report-f13 native-report-f14 native-report-f15 native-report-f16 nf-ux-02b-v1-differential nf-ux-02b-v2 nf-ux-02b-media nf-ux-02c-immutability nf-ux-02c1-persistence nf-ux-02c2-recovery native-media-f17b native-media-no-media-differential native-social-preference; do
            php tests/$test.php > evidence/$test.log
          done
      - name: Frozen semantic differential and presentation regression
        run: |
          set -euo pipefail
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund
          node --test --test-concurrency=1 tests/nf-ux-04-model.cjs tests/nf-ux-04-dom.cjs tests/nf-ux-04-service.cjs ops/nf05b-emergency.cjs tests/nf-final-01-consolidation.cjs tests/f1-15b-r5-smart-address.cjs tests/native-social-preference.cjs tests/geo-public-03-choice.cjs tests/native-media-f17d.cjs tests/native-media-f17d-dom.cjs tests/native-media-f17e.cjs 2>&1 | tee evidence/differential.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nffinal01-semantic-evidence
          path: evidence/
          retention-days: 90
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: mkdir -p evidence/screenshots tls
      - name: Provision officially signed chain and verify against runner root trust
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASS"
          ca=/etc/ssl/certs/ca-certificates.crt
          test -s "$ca"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          test "$(openssl x509 -in tls/yr2.pem -noout -subject)" = "subject=C = US, O = Let's Encrypt, CN = YR2"
          test "$(openssl x509 -in tls/yr-by-x1.pem -noout -subject)" = "subject=C = US, O = ISRG, CN = Root YR"
          openssl verify -CAfile "$ca" -untrusted tls/yr-by-x1.pem tls/yr2.pem
          cat tls/yr2.pem tls/yr-by-x1.pem > tls/untrusted.pem
          cat "$ca" tls/untrusted.pem > tls/curl-chain.pem
          timeout 30s openssl s_client -starttls ftp -connect "${FTP_HOST}:21" -servername "$FTP_TLS_NAME" -verify_hostname "$FTP_TLS_NAME" -verify_return_error -CAfile tls/curl-chain.pem < /dev/null > tls/handshake.log 2>&1
          grep -q 'Verify return code: 0 (ok)' tls/handshake.log
          echo 'FTPS server identity and chain VERIFIED; strict TLS remains enabled.'
      - name: Read-only certified staging custody and Astra assets; no staging HTTP or probes
        run: python3 ops/nffinal01-custody.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Official pinned Chromium
        timeout-minutes: 10
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '20000'
        run: |
          npm install --prefix /tmp/nffinal --ignore-scripts --no-audit --no-fund playwright@1.56.1
          /tmp/nffinal/node_modules/.bin/playwright install --with-deps chromium
      - name: Five widths full templates; GEO provider boundary; eight specifications and emergency
        env:
          BA_PLAYWRIGHT_MODULE: /tmp/nffinal/node_modules/playwright
          BA_SCREENSHOT_DIR: evidence/screenshots
        run: |
          set -euo pipefail
          node tests/nf-final-01-responsive.cjs 2>&1 | tee evidence/responsive.log
          node tests/nf-final-01-location.cjs 2>&1 | tee evidence/location.log
          node tests/nf-ux-04-browser.cjs 2>&1 | tee evidence/altro.log
          node tests/nf-ux-04-emergency-browser.cjs 2>&1 | tee evidence/emergency.log
      - name: Final read-only staging custody
        run: python3 ops/nffinal01-custody.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nffinal01-browser-evidence
          path: evidence/
          retention-days: 90
