name: BadAround event detail guarded release
on:
  push:
    branches: [reconcile/identity-production-baseline-20261104]
    paths:
      - wordpress/plugins/badaround-core/includes/class-badaround-event-public-details.php
      - tools/ba_event_detail_release.py
      - .github/workflows/ba-event-detail.yml
permissions:
  contents: read
concurrency:
  group: ba-event-detail-release
  cancel-in-progress: false
jobs:
  release:
    if: contains(github.event.head_commit.message, '[event-detail-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 55b4078ab8247c18cfbc7c7629682fb0e0a15014
          path: prior-source
          persist-credentials: false
      - name: Verify publication, GEO, privacy and detail projection
        run: |
          php tests/test-ba-event-public-details.php
          php tests/test-ba-event-seo.php
          php tests/geo-prec-01-publication.php
          php tests/geo-area-01-publication.php
          php tests/f1-14r-publication-contract.php
          php tests/test-ba-community-review.php
          php -l wordpress/plugins/badaround-core/includes/class-badaround-event-public-details.php
          php -l wordpress/plugins/badaround-core/includes/class-badaround-publication-service.php
          php -l wordpress/plugins/badaround-core/includes/class-badaround-event-seo.php
          php -l wordpress/themes/badaround-child/template-parts/single-event-layout.php
          python3 -m unittest discover -s tests -p test_ba_event_seo_release.py
          python3 -m py_compile tools/ba_event_detail_release.py
      - name: Prepare verified FTPS trust chain
        run: |
          mkdir -p tls
          curl -fsSL https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat /etc/ssl/certs/ca-certificates.crt tls/yr2.pem tls/yr-by-x1.pem > tls/chain.pem
      - name: Install scoped detail files with verified backup
        env:
          FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_SFTP_PASSWORD }}
          FTP_TLS_CA_FILE: tls/chain.pem
        run: python3 tools/ba_event_detail_release.py
