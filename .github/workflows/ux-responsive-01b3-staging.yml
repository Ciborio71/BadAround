name: UX-RESPONSIVE-01B.3 guarded staging deploy
on:
  push:
    branches: [deploy/ux-responsive-01b3-staging]
    paths: ['ops/ux-responsive-01b3-deploy-launch.txt']
permissions:
  contents: read
  actions: read
concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
      QA_RUN: 40111336042
      CANDIDATE: 86d12960b041cedc8b2272c6b18d6a714b0fe8c2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/ux-responsive-01b3-staging
          fetch-depth: 0
      - name: Verify QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request('https://api.github.com/repos/Ciborio71/BadAround/actions/runs/'+os.environ['QA_RUN'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r:j=json.load(r)
          assert j['head_sha']==os.environ['CANDIDATE'] and j['conclusion']=='success'
          PY
          git diff --check e7a6b191c60e49ba5f83e6f3a30008f821a05704 86d12960b041cedc8b2272c6b18d6a714b0fe8c2
      - name: Verify FTPS TLS
        run: |
          set -euo pipefail
          mkdir -p tls evidence
          ca=/etc/ssl/certs/ca-certificates.crt
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          cat tls/yr2.pem tls/yr-by-x1.pem > tls/untrusted.pem
          cat "$ca" tls/untrusted.pem > tls/curl-chain.pem
          openssl verify -CAfile "$ca" -untrusted tls/yr-by-x1.pem tls/yr2.pem
      - name: Prepare byte-exact rollback
        run: python ops/ux-responsive-01b3-deploy.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: ux-responsive-01b3-rollback
          path: evidence/
          retention-days: 90
      - name: Upload six authorized runtime files
        id: upload
        continue-on-error: true
        run: python ops/ux-responsive-01b3-deploy.py deploy
      - name: Verify remote candidate
        id: verify
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        run: python ops/ux-responsive-01b3-deploy.py verify
      - name: Public HTTP smoke
        id: smoke
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://staging.badaround.it/sentinelle/ -o sentinelle.html
          curl --fail --silent --show-error --location https://staging.badaround.it/privacy-policy/ -o privacy.html
          grep -q 'data-ba-sentinel-territory-search' sentinelle.html
          grep -q 'legal.css' privacy.html
      - name: Rollback on failure
        if: always() && steps.upload.outcome != 'skipped' && (steps.upload.outcome == 'failure' || steps.verify.outcome != 'success' || steps.smoke.outcome != 'success')
        run: python ops/ux-responsive-01b3-deploy.py rollback
      - name: Final gate
        if: always()
        run: |
          test '${{ steps.upload.outcome }}' = success
          test '${{ steps.verify.outcome }}' = success
          test '${{ steps.smoke.outcome }}' = success
