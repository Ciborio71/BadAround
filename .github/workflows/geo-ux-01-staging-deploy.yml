name: GEO-UX-01 verified three-file staging deploy
on:
  push:
    branches: [deploy/geo-ux-01-staging]
permissions:
  contents: read
concurrency:
  group: badaround-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      FTP_HOST: ${{ secrets.STAGING_SFTP_HOST }}
      FTP_USER: ${{ secrets.STAGING_SFTP_USERNAME }}
      FTP_PASS: ${{ secrets.STAGING_SFTP_PASSWORD }}
      FTP_TLS_NAME: hostmld17.aziendeitalia.com
      EXPECTED_CANDIDATE: 5c74f9ec053365c2efefbf57adb775a5a3abe633
      BASELINE: e401cc28a6f7ee35638f3b9d8f2a903ffbeff727
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5c74f9ec053365c2efefbf57adb775a5a3abe633
          fetch-depth: 0
      - name: Verify candidate and exact child-theme scope
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/deploy/geo-ux-01-staging
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          git diff --exit-code "$BASELINE" HEAD -- wordpress/plugins
          git diff --name-only "$BASELINE" HEAD -- wordpress > affected.txt
          printf '%s\n' wordpress/themes/badaround-child/assets/js/native-report/location-map.js wordpress/themes/badaround-child/assets/js/native-report/smart-address.js wordpress/themes/badaround-child/template-parts/native-report/step.php > expected.txt
          cmp affected.txt expected.txt
          git diff --check "$BASELINE" HEAD
          mkdir -p new old rollback verified tls
          for file in assets/js/native-report/location-map.js assets/js/native-report/smart-address.js template-parts/native-report/step.php; do
            mkdir -p "new/$(dirname "$file")" "old/$(dirname "$file")" "rollback/$(dirname "$file")" "verified/$(dirname "$file")"
            cp "wordpress/themes/badaround-child/$file" "new/$file"
            git show "$BASELINE:wordpress/themes/badaround-child/$file" > "old/$file"
          done
          test "$(find new -type f | wc -l)" -eq 3
      - name: Provision officially signed chain and verify against runner root trust
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASS"
          ca=/etc/ssl/certs/ca-certificates.crt
          test -s "$ca"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/int-yr2.pem -o tls/yr2.pem
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 25 https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem -o tls/yr-by-x1.pem
          test "$(openssl x509 -in tls/yr2.pem -noout -subject)" = "subject=C = US, O = Let's Encrypt, CN = YR2"
          test "$(openssl x509 -in tls/yr-by-x1.pem -noout -subject)" = "subject=C = US, O = ISRG, CN = Root YR"
          openssl verify -CAfile "$ca" -untrusted tls/yr-by-x1.pem tls/yr2.pem
          cat tls/yr2.pem tls/yr-by-x1.pem > tls/untrusted.pem
          cat "$ca" tls/untrusted.pem > tls/curl-chain.pem
          timeout 30s openssl s_client -starttls ftp -connect "${FTP_HOST}:21" -servername "$FTP_TLS_NAME" -verify_hostname "$FTP_TLS_NAME" -verify_return_error -CAfile tls/curl-chain.pem < /dev/null > tls/handshake.log 2>&1
          grep -q 'Verify return code: 0 (ok)' tls/handshake.log
          echo 'FTPS server identity and chain VERIFIED; strict TLS remains enabled.'
      - name: Capture remote bytes and enforce baseline before any upload
        run: |
          set -euo pipefail
          for file in assets/js/native-report/location-map.js assets/js/native-report/smart-address.js template-parts/native-report/step.php; do
            remote="ftp://${FTP_TLS_NAME}:21/staging.badaround.it/wp-content/themes/badaround-child/$file"
            curl --fail --silent --show-error --ssl-reqd --cacert tls/curl-chain.pem --connect-to "${FTP_TLS_NAME}:21:${FTP_HOST}:21" --user "$FTP_USER:$FTP_PASS" --connect-timeout 12 --max-time 90 "$remote" -o "rollback/$file"
            cmp "rollback/$file" "old/$file"
            sha256sum "rollback/$file" "new/$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: geo-ux-01-byte-exact-rollback
          path: rollback/
          retention-days: 30
          if-no-files-found: error
      - name: Upload only the three approved theme files
        id: upload
        continue-on-error: true
        run: |
          set -euo pipefail
          for file in assets/js/native-report/location-map.js assets/js/native-report/smart-address.js template-parts/native-report/step.php; do
            remote="ftp://${FTP_TLS_NAME}:21/staging.badaround.it/wp-content/themes/badaround-child/$file"
            curl --fail --silent --show-error --ssl-reqd --cacert tls/curl-chain.pem --connect-to "${FTP_TLS_NAME}:21:${FTP_HOST}:21" --user "$FTP_USER:$FTP_PASS" --connect-timeout 12 --max-time 90 --upload-file "new/$file" "$remote"
          done
      - name: Verify actual remote candidate bytes
        id: verify
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          for file in assets/js/native-report/location-map.js assets/js/native-report/smart-address.js template-parts/native-report/step.php; do
            remote="ftp://${FTP_TLS_NAME}:21/staging.badaround.it/wp-content/themes/badaround-child/$file"
            curl --fail --silent --show-error --ssl-reqd --cacert tls/curl-chain.pem --connect-to "${FTP_TLS_NAME}:21:${FTP_HOST}:21" --user "$FTP_USER:$FTP_PASS" --connect-timeout 12 --max-time 90 "$remote" -o "verified/$file"
            cmp "verified/$file" "new/$file"
            sha256sum "verified/$file"
          done
      - name: Restore all original remote files after any failed upload or verification
        if: always() && (steps.upload.outcome == 'failure' || (steps.upload.outcome == 'success' && steps.verify.outcome != 'success'))
        run: |
          set -euo pipefail
          for file in assets/js/native-report/location-map.js assets/js/native-report/smart-address.js template-parts/native-report/step.php; do
            remote="ftp://${FTP_TLS_NAME}:21/staging.badaround.it/wp-content/themes/badaround-child/$file"
            test -s "rollback/$file"
            curl --fail --silent --show-error --ssl-reqd --cacert tls/curl-chain.pem --connect-to "${FTP_TLS_NAME}:21:${FTP_HOST}:21" --user "$FTP_USER:$FTP_PASS" --connect-timeout 12 --max-time 90 --upload-file "rollback/$file" "$remote"
            curl --fail --silent --show-error --ssl-reqd --cacert tls/curl-chain.pem --connect-to "${FTP_TLS_NAME}:21:${FTP_HOST}:21" --user "$FTP_USER:$FTP_PASS" --connect-timeout 12 --max-time 90 "$remote" -o "verified/$file"
            cmp "verified/$file" "rollback/$file"
          done
      - name: Final deployment gate
        if: always()
        run: test '${{ steps.verify.outcome }}' = success
